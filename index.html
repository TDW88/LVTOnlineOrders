const WEBHOOK_URL = 'https://webhooks.workato.com/webhooks/rest/6a7e39d0-1da9-4e30-8ab7-b7c732cbcb0f/order';

// Per-location intrusion detection / deterrence configuration
const ANNOUNCEMENT_OPTIONS = [
  { value: 'classical', label: 'Royalty Free Classical Music' },
  { value: 'safety-recorded', label: 'For your safety, area being recorded.' },
  { value: 'parking-recorded', label: 'Parking lot being recorded.' }
];

const ANNOUNCEMENT_SCHEDULES = [
  { value: 'day', label: 'Day' },
  { value: 'night', label: 'Night' }
];

const DETECTION_RESPONSES = [
  { field: 'intelligentDeterrence', label: 'Intelligent Deterrence' },
  { field: 'strobe', label: 'Strobe Light' },
  { field: 'floodlight', label: 'Flood Light' },

const makeLocationConfig = () => ({
  intrusionDetection: null,   // 'yes' | 'no'
  idleStrobe: null,           // 'on' | 'off' — asked either way
  schedule: { armFrom: '06:00', armUntil: '18:00' },
  specialDays: { allHolidays: false, writeInEnabled: false, writeIn: '' },
  announcement: null,
  announcementSchedule: null,
  detect: { human: false, vehicle: false },
  trigger: null,              // 'loiter' | 'immediate'
  loiterSeconds: 30,
  detectWhere: '',
  response: { intelligentDeterrence: false, strobe: false, floodlight: false, audible: false }
});

function LVTConfigurator() {
  const [currentStep, setCurrentStep] = useState(0);
  const [isSubmitting, setIsSubmitting] = useState(false);
  // "Talk to a sales rep" helper form — shown on every step, separate from the order
  const [salesRep, setSalesRep] = useState({
    open: false,
    name: '',
    email: '',
    phone: '',
    question: '',
    submitting: false,
    submitted: false
  });
  // Set once an order has been filed. Persists on screen rather than living in an alert()
  // the customer can dismiss and lose, and it gates the submit button so the same order
  // cannot be sent twice — a resubmission mints a fresh order id, so Hermes would file it
  // as a second, separate order rather than deduplicating it.
  const [orderConfirmation, setOrderConfirmation] = useState(null);
  const [config, setConfig] = useState({
    locations: [
      {
        id: 1,
        name: '',
        zipCode: '',
        units: [
          { id: 1, unitType: 'mobile', needsGenerator: false, recommendedGenerator: false, quantity: 1 }
        ]
      }
    ],
    cameraConfig: {
      ndaaRequired: null, // null | 'yes' | 'no' — order-level compliance requirement
      sku: null,          // default SKU applied to every unit
      overrides: {}       // { [unitKey]: sku } for units that differ from the default
    },
    lpr: false,
    satCom: false,
    generatorBypass: false, // customer accepts downtime unless externally powered
    softwarePackages: [],
    leaseTerm: null, // in months: 12, 24, 36
    contactInfo: {
      email: '',
      phone: '',
      companyName: '',
      fullName: '',
      billingAddress: {
        street: '',
        city: '',
        state: '',
        zip: ''
      },
      shippingAddresses: [],
      onsiteContact: {
        sameAsPrimary: false, // starts unchecked — the user opts in when it is the same person
        name: '',
        phone: ''
      }
    },
    siteConfig: {
      placementMapName: '',
      placementMapLater: false, // "Placement map will be determined later"
      gpsCoordinates: [], // one { lat, long } per unit, index-aligned with gpsUnitList
      ars: {
        enabled: null, // null | 'yes' | 'no'
        tier: null,    // 'standard' | 'expanded' | 'custom'
        customDetail: '', // required when tier is 'custom'
        contacts: [
          { name: '', email: '', phone: '' },
          { name: '', email: '', phone: '' }
        ]
      },
      // Keyed by location id — one analytics configuration per deployment location
      locationConfigs: { 1: makeLocationConfig() },
      areasOfConcern: ''
    }
  });

  const getUnitType = (unitTypeId) => UNIT_TYPES.find(type => type.id === unitTypeId) || UNIT_TYPES[0];
  
  // Generator cost (monthly)
  const GENERATOR_MONTHLY = 1000;
  
  // Hardware options pricing (monthly)
  const LPR_MONTHLY = 500;
  const SATCOM_MONTHLY = 500;

  // Alert Response Services (ARS) tiers — priced monthly, per unit.
  // 'custom' covers legacy arrangements and is quoted by a rep rather than priced here.
  const ARS_TIERS = [
    { value: 'standard', label: 'Standard', coverage: '12 hours of coverage', monthly: 300 },
    { value: 'expanded', label: 'Expanded', coverage: '24 hours of coverage', monthly: 500 },
    { value: 'custom', label: 'Custom', coverage: 'Legacy or tailored coverage', monthly: null }
  ];
  const getArsTier = (value) => ARS_TIERS.find(tier => tier.value === value) || null;
  
  // Software packages (monthly)
  const softwarePackages = [
    {
      id: 'detect-deter',
      name: 'Intelligent Deterrence',
      monthlyPrice: 500,
      description: 'AI-powered intrusion detection with automated deterrence (strobes, spotlights, audio warnings)',
      features: ['Real-time threat detection', 'Automated audio warnings', 'Strobe & spotlight activation', 'Custom alert rules']
    },
    {
      id: 'alert-management',
      name: 'Intelligent Investigations',
      monthlyPrice: 500,
      description: 'Advanced alert routing and response workflow management',
      features: ['Multi-channel alerts (SMS, email, push)', 'Alert escalation workflows', 'Response tracking', 'Integration with security teams']
    },
    {
      id: 'enterprise',
      name: 'Intelligent Safety',
      monthlyPrice: 500,
      description: 'SafeNow integration site-wide, the ability to arm and disarm the unit from an approved mobile device',
      features: ['Centralized dashboard', 'Multi-site management', 'Advanced analytics & reporting', 'Custom user permissions', 'API access']
    }
  ];

  // Lease term options
  const leaseTerms = [
    { months: 12, label: '12 Months', discount: 0 },
    { months: 24, label: '24 Months', discount: 0.05 }, // 5% discount
    { months: 36, label: '36 Months', discount: 0.10 }  // 10% discount
  ];

  const steps = ['Location', 'Cameras', 'Hardware', 'Software', 'Lease Term', 'Contact Info', 'Configuration', 'Review'];

  const totalUnits = config.locations.reduce((sum, location) => {
    const locationTotal = location.units.reduce((unitSum, unit) => unitSum + (unit.quantity || 0), 0);
    return sum + locationTotal;
  }, 0);

  // One GPS entry per physical unit selected in Step 1 (expanded by quantity)
  const gpsUnitList = config.locations.flatMap((location, locationIdx) =>
    location.units.flatMap(unit =>
      Array.from({ length: unit.quantity || 0 }, () => ({
        typeName: getUnitType(unit.unitType).name,
        locationName: (location.name && location.name.trim()) || `Location ${locationIdx + 1}`,
        zip: location.zipCode
      }))
    )
  );

  const uniqueLocationZips = [
    ...new Set(config.locations.map(location => location.zipCode).filter(zip => zip.length === 5))
  ];

  const unitsByZip = config.locations.reduce((acc, location) => {
    if (location.zipCode.length === 5) {
      const locationTotal = location.units.reduce((sum, unit) => sum + (unit.quantity || 0), 0);
      acc[location.zipCode] = (acc[location.zipCode] || 0) + locationTotal;
    }
    return acc;
  }, {});

  // Land at the top of each step rather than wherever the previous one was scrolled to
  useEffect(() => {
    window.scrollTo(0, 0);
  }, [currentStep]);

  useEffect(() => {
    setConfig(prev => {
      const existing = prev.contactInfo.shippingAddresses || [];
      const nextShippingAddresses = uniqueLocationZips.map(zip => {
        const match = existing.find(address => address.zipCode === zip);
        if (match) {
          return { ...match, zipCode: zip };
        }
        return {
          zipCode: zip,
          street: '',
          city: '',
          state: '',
          zip: '',
          sameAsBilling: false
        };
      });

      const hasChanges = nextShippingAddresses.length !== existing.length
        || nextShippingAddresses.some((address, idx) => address.zipCode !== existing[idx]?.zipCode);

      if (!hasChanges) {
        return prev;
      }

      return {
        ...prev,
        contactInfo: {
          ...prev.contactInfo,
          shippingAddresses: nextShippingAddresses
        }
      };
    });
  }, [uniqueLocationZips.join('|')]);

  useEffect(() => {
    setConfig(prev => {
      const nextLocations = prev.locations.map(location => ({
        ...location,
        units: location.units.map(unit => {
          const unitType = getUnitType(unit.unitType);
          if (unitType.generatorEligible) {
            return unit;
          }
          return { ...unit, needsGenerator: false };
        })
      }));
      const hasChanges = nextLocations.some((location, idx) =>
        location.units.some((unit, unitIdx) => unit.needsGenerator !== prev.locations[idx].units[unitIdx].needsGenerator)
      );
      if (!hasChanges) {
        return prev;
      }
      return { ...prev, locations: nextLocations };
    });
  }, [config.locations]);

  // Simulate zip code lookup for generator requirements
  // In production, this would call an API
  const toggleUnitGenerator = (locationId, unitId) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) return location;
        return {
          ...location,
          units: location.units.map(unit => {
            if (unit.id !== unitId) return unit;
            if (!getUnitType(unit.unitType).generatorEligible) return unit;
            return { ...unit, needsGenerator: !unit.needsGenerator };
          })
        };
      })
    }));
  };

  const setAllGeneratorsAtLocation = (locationId, value) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) return location;
        return {
          ...location,
          units: location.units.map(unit =>
            getUnitType(unit.unitType).generatorEligible ? { ...unit, needsGenerator: value } : unit
          )
        };
      })
    }));
  };

  const updateLocationName = (locationId, name) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location =>
        location.id === locationId ? { ...location, name } : location
      )
    }));
  };

  const checkGeneratorRequirement = (zip) => {
    // Simplified logic: certain regions need generators
    // This would be replaced with actual API call to lookup table
    const firstDigit = parseInt(zip.charAt(0));
    // Simulate northern/colder states needing generators more often
    // 0-2 = Northeast, 3-5 = Southeast/Central, 6-9 = West
    if (firstDigit >= 0 && firstDigit <= 2) {
      return Math.random() > 0.3; // 70% need generator in cold climates
    } else if (firstDigit >= 3 && firstDigit <= 5) {
      return Math.random() > 0.6; // 40% need generator in moderate climates
    } else {
      return Math.random() > 0.7; // 30% need generator in warm climates
    }
  };



  const addLocation = () => {
    const newId = Math.max(...config.locations.map(location => location.id)) + 1;
    setConfig(prev => ({
      ...prev,
      locations: [
        ...prev.locations,
        {
          id: newId,
          name: '',
          zipCode: '',
          units: [{ id: 1, unitType: 'mobile', needsGenerator: false, recommendedGenerator: false, quantity: 1 }]
        }
      ]
    }));
  };

  const removeLocation = (locationId) => {
    if (config.locations.length > 1) {
      setConfig(prev => ({
        ...prev,
        locations: prev.locations.filter(location => location.id !== locationId)
      }));
    }
  };

  const updateLocationZipCode = (locationId, zipCode) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location =>
        location.id === locationId ? { ...location, zipCode } : location
      )
    }));
  };

  const addUnitToLocation = (locationId) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        const nextId = Math.max(...location.units.map(unit => unit.id)) + 1;
        return {
          ...location,
          units: [...location.units, { id: nextId, unitType: 'mobile', needsGenerator: false, recommendedGenerator: false, quantity: 1 }]
        };
      })
    }));
  };

  const removeUnitFromLocation = (locationId, unitId) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        if (location.units.length === 1) {
          return location;
        }
        return {
          ...location,
          units: location.units.filter(unit => unit.id !== unitId)
        };
      })
    }));
  };

  const updateUnitQuantity = (locationId, unitId, quantity) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        return {
          ...location,
          units: location.units.map(unit =>
            unit.id === unitId ? { ...unit, quantity } : unit
          )
        };
      })
    }));
  };

  const updateUnitType = (locationId, unitId, unitTypeId) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        return {
          ...location,
          units: location.units.map(unit => {
            if (unit.id !== unitId) {
              return unit;
            }
            const unitType = getUnitType(unitTypeId);
            if (!unitType.generatorEligible) {
              return { ...unit, unitType: unitTypeId, needsGenerator: false, recommendedGenerator: false };
            }
            const needsGenerator = location.zipCode.length === 5
              ? checkGeneratorRequirement(location.zipCode)
              : unit.needsGenerator;
            return { ...unit, unitType: unitTypeId, needsGenerator, recommendedGenerator: needsGenerator };
          })
        };
      })
    }));
  };

  const checkGeneratorForUnit = (locationId, unitId, zip) => {
    const location = config.locations.find(entry => entry.id === locationId);
    if (!location) {
      return;
    }
    const unit = location.units.find(entry => entry.id === unitId);
    if (!unit) {
      return;
    }
    const unitType = getUnitType(unit.unitType);
    if (!unitType.generatorEligible) {
      setConfig(prev => ({
        ...prev,
        locations: prev.locations.map(loc => {
          if (loc.id !== locationId) {
            return loc;
          }
          return {
            ...loc,
            units: loc.units.map(line =>
              line.id === unitId ? { ...line, needsGenerator: false, recommendedGenerator: false } : line
            )
          };
        })
      }));
      return;
    }
    const needsGen = checkGeneratorRequirement(zip);
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(loc => {
        if (loc.id !== locationId) {
          return loc;
        }
        return {
          ...loc,
          units: loc.units.map(line =>
            line.id === unitId ? { ...line, needsGenerator: needsGen, recommendedGenerator: needsGen } : line
          )
        };
      })
    }));
  };

  const handleZipCodeSubmit = () => {
    const allZipsValid = config.locations.every(location =>
      location.zipCode.length === 5 && location.units.every(unit => unit.quantity > 0)
    );
    if (allZipsValid) {
      // Check generator requirements for generator-eligible unit types
      config.locations.forEach(location => {
        location.units.forEach(unit => {
          checkGeneratorForUnit(location.id, unit.id, location.zipCode);
        });
      });
      setCurrentStep(1);
    }
  };

  const calculateMonthlyTotal = () => {
    const unitCount = totalUnits;
    
    const baseMonthlyTotal = config.locations.reduce((sum, location) => {
      const locationTotal = location.units.reduce((unitSum, unit) => {
        const unitType = getUnitType(unit.unitType);
        return unitSum + (unitType.baseMonthly * (unit.quantity || 0));
      }, 0);
      return sum + locationTotal;
    }, 0);
    let perUnitMonthly = 0;
    
    // Add hardware options (applied to all units)
    if (config.lpr) {
      perUnitMonthly += LPR_MONTHLY;
    }
    if (config.satCom) {
      perUnitMonthly += SATCOM_MONTHLY;
    }
    
    // Calculate base cost for all units
    let monthlyTotal = baseMonthlyTotal + (perUnitMonthly * unitCount);
    
    // Add generators (varies by unit location)
    const generatorCount = config.locations.reduce((sum, location) => {
      const locationGenerators = location.units
        .filter(unit => getUnitType(unit.unitType).generatorEligible && unit.needsGenerator)
        .reduce((unitSum, unit) => unitSum + (unit.quantity || 0), 0);
      return sum + locationGenerators;
    }, 0);
    monthlyTotal += generatorCount * GENERATOR_MONTHLY;
    
    // Add software packages (per unit)
    config.softwarePackages.forEach(id => {
      const pkg = softwarePackages.find(p => p.id === id);
      if (pkg) monthlyTotal += pkg.monthlyPrice * unitCount;
    });

    // Add Alert Response Services (per unit; 'custom' is quoted separately)
    if (config.siteConfig.ars.enabled === 'yes' && config.siteConfig.ars.tier) {
      const arsTier = getArsTier(config.siteConfig.ars.tier);
      if (arsTier && arsTier.monthly) {
        monthlyTotal += arsTier.monthly * unitCount;
      }
    }
    
    // Apply lease term discount if selected
    if (config.leaseTerm) {
      const term = leaseTerms.find(t => t.months === config.leaseTerm);
      if (term && term.discount > 0) {
        monthlyTotal = monthlyTotal * (1 - term.discount);
      }
    }
    
    return monthlyTotal;
  };

  // Helper to calculate monthly total for a specific term (for lease term cards)
  const calculateMonthlyForTerm = (termMonths) => {
    const unitCount = totalUnits;
    
    const baseMonthlyTotal = config.locations.reduce((sum, location) => {
      const locationTotal = location.units.reduce((unitSum, unit) => {
        const unitType = getUnitType(unit.unitType);
        return unitSum + (unitType.baseMonthly * (unit.quantity || 0));
      }, 0);
      return sum + locationTotal;
    }, 0);
    let perUnitMonthly = 0;
    
    // Add hardware options (applied to all units)
    if (config.lpr) {
      perUnitMonthly += LPR_MONTHLY;
    }
    if (config.satCom) {
      perUnitMonthly += SATCOM_MONTHLY;
    }
    
    // Calculate base cost for all units
    let monthlyTotal = baseMonthlyTotal + (perUnitMonthly * unitCount);
    
    // Add generators (varies by unit location)
    const generatorCount = config.locations.reduce((sum, location) => {
      const locationGenerators = location.units
        .filter(unit => getUnitType(unit.unitType).generatorEligible && unit.needsGenerator)
        .reduce((unitSum, unit) => unitSum + (unit.quantity || 0), 0);
      return sum + locationGenerators;
    }, 0);
    monthlyTotal += generatorCount * GENERATOR_MONTHLY;
    
    // Add software packages (per unit)
    config.softwarePackages.forEach(id => {
      const pkg = softwarePackages.find(p => p.id === id);
      if (pkg) monthlyTotal += pkg.monthlyPrice * unitCount;
    });

    // Add Alert Response Services (per unit; 'custom' is quoted separately)
    if (config.siteConfig.ars.enabled === 'yes' && config.siteConfig.ars.tier) {
      const arsTier = getArsTier(config.siteConfig.ars.tier);
      if (arsTier && arsTier.monthly) {
        monthlyTotal += arsTier.monthly * unitCount;
      }
    }
    
    // Apply discount for this specific term
    const term = leaseTerms.find(t => t.months === termMonths);
    if (term && term.discount > 0) {
      monthlyTotal = monthlyTotal * (1 - term.discount);
    }
    
    return monthlyTotal;
  };

  const calculateContractTotal = () => {
    if (!config.leaseTerm) return 0;
    return calculateMonthlyTotal() * config.leaseTerm;
  };

  const toggleHardwareOption = (option) => {
    setConfig(prev => ({ ...prev, [option]: !prev[option] }));
  };

  const isNdaaCompliantSku = (sku) => {
    const option = CAMERA_OPTIONS.find(o => o.sku === sku);
    return !!(option && option.ndaa);
  };

  const updateCameraConfig = (field, value) => {
    setConfig(prev => {
      const next = { ...prev.cameraConfig, [field]: value };
      // Each mode has its own packages, so changing the answer invalidates any
      // default or override belonging to the other mode
      if (field === 'ndaaRequired' && value !== null) {
        const wantNdaa = value === 'yes';
        if (next.sku && isNdaaCompliantSku(next.sku) !== wantNdaa) next.sku = null;
        next.overrides = Object.fromEntries(
          Object.entries(next.overrides).filter(([, sku]) => isNdaaCompliantSku(sku) === wantNdaa)
        );
      }
      return { ...prev, cameraConfig: next };
    });
  };

  // Passing an empty value clears the override so the unit follows the default
  const setCameraOverride = (unitKey, sku) => {
    setConfig(prev => {
      const overrides = { ...prev.cameraConfig.overrides };
      if (!sku) delete overrides[unitKey];
      else overrides[unitKey] = sku;
      return { ...prev, cameraConfig: { ...prev.cameraConfig, overrides } };
    });
  };

  const clearCameraOverrides = () => {
    setConfig(prev => ({ ...prev, cameraConfig: { ...prev.cameraConfig, overrides: {} } }));
  };

  const toggleSoftwarePackage = (id) => {
    setConfig(prev => {
      const packages = prev.softwarePackages.includes(id)
        ? prev.softwarePackages.filter(p => p !== id)
        : [...prev.softwarePackages, id];
      return { ...prev, softwarePackages: packages };
    });
  };

  const updateContactInfo = (field, value) => {
    setConfig(prev => ({
      ...prev,
      contactInfo: {
        ...prev.contactInfo,
        [field]: value
      }
    }));
  };

  const updateAddress = (type, field, value) => {
    setConfig(prev => ({
      ...prev,
      contactInfo: {
        ...prev.contactInfo,
        [type]: {
          ...prev.contactInfo[type],
          [field]: value
        }
      }
    }));
  };

  const updateShippingAddress = (zipCode, field, value) => {
    setConfig(prev => ({
      ...prev,
      contactInfo: {
        ...prev.contactInfo,
        shippingAddresses: prev.contactInfo.shippingAddresses.map(address =>
          address.zipCode === zipCode ? { ...address, [field]: value } : address
        )
      }
    }));
  };

  // Keep one analytics config per location as locations are added or removed
  useEffect(() => {
    setConfig(prev => {
      const next = {};
      let changed = false;
      prev.locations.forEach(location => {
        next[location.id] = prev.siteConfig.locationConfigs[location.id] || makeLocationConfig();
        if (!prev.siteConfig.locationConfigs[location.id]) changed = true;
      });
      if (!changed && Object.keys(next).length === Object.keys(prev.siteConfig.locationConfigs).length) {
        return prev;
      }
      return { ...prev, siteConfig: { ...prev.siteConfig, locationConfigs: next } };
    });
  }, [config.locations.map(l => l.id).join(',')]);

  // A location's display name, falling back to its position when unnamed
  const locationLabel = (location, idx) =>
    (location && location.name && location.name.trim()) || `Location ${idx + 1}`;
  const locationLabelById = (locationId) => {
    const idx = config.locations.findIndex(l => l.id === locationId);
    return idx === -1 ? 'Location' : locationLabel(config.locations[idx], idx);
  };

  const getLocationConfig = (locationId) =>
    config.siteConfig.locationConfigs[locationId] || makeLocationConfig();

  // path is a dot path within the location config, e.g. 'schedule.armFrom'
  const updateLocationConfig = (locationId, path, value) => {
    setConfig(prev => {
      const current = prev.siteConfig.locationConfigs[locationId] || makeLocationConfig();
      const parts = path.split('.');
      const updated = { ...current };
      let cursor = updated;
      for (let i = 0; i < parts.length - 1; i++) {
        cursor[parts[i]] = { ...cursor[parts[i]] };
        cursor = cursor[parts[i]];
      }
      cursor[parts[parts.length - 1]] = value;
      return {
        ...prev,
        siteConfig: {
          ...prev.siteConfig,
          locationConfigs: { ...prev.siteConfig.locationConfigs, [locationId]: updated }
        }
      };
    });
  };

  const copyLocationConfig = (fromLocationId, toLocationId) => {
    setConfig(prev => {
      const source = prev.siteConfig.locationConfigs[fromLocationId];
      if (!source) return prev;
      return {
        ...prev,
        siteConfig: {
          ...prev.siteConfig,
          locationConfigs: {
            ...prev.siteConfig.locationConfigs,
            [toLocationId]: JSON.parse(JSON.stringify(source))
          }
        }
      };
    });
  };

  // Alerting hours are capped by the ARS tier: Standard buys 12 hours of
  // coverage a day, Expanded and Custom are unlimited.
  const arsMaxAlertingMinutes = () => {
    const { ars } = config.siteConfig;
    if (ars.enabled === 'yes' && ars.tier === 'standard') return 12 * 60;
    return null;
  };

  const scheduleMinutes = (schedule) => {
    if (!schedule.armFrom || !schedule.armUntil) return null;
    const toMin = (t) => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    };
    const diff = (toMin(schedule.armUntil) - toMin(schedule.armFrom) + 1440) % 1440;
    return diff === 0 ? 1440 : diff; // identical times read as always armed
  };

  const formatMinutes = (mins) => {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return m === 0 ? `${h} hr` : `${h} hr ${m} min`;
  };

  const scheduleExceedsArsCap = (schedule) => {
    const cap = arsMaxAlertingMinutes();
    const mins = scheduleMinutes(schedule);
    return cap !== null && mins !== null && mins > cap;
  };

  // Selecting the Intelligent Deterrence software package fixes the response
  const intelligentDeterrenceIncluded = config.softwarePackages.includes('detect-deter');

  // With the package selected it is the only response offered; without it, it is
  // not offered at all.
  const availableResponses = intelligentDeterrenceIncluded
    ? DETECTION_RESPONSES.filter(r => r.field === 'intelligentDeterrence')
    : DETECTION_RESPONSES.filter(r => r.field !== 'intelligentDeterrence');

  // Reads back whatever the customer chose to detect, for use in later prompts
  const detectedLabel = (lc) => {
    const picked = [lc.detect.human ? 'Humans' : null, lc.detect.vehicle ? 'Vehicles' : null].filter(Boolean);
    if (picked.length === 0) return 'these objects';
    return picked.join(' and ');
  };

  const locationConfigComplete = (locationId) => {
    const lc = getLocationConfig(locationId);
    if (!lc.idleStrobe) return false;
    if (lc.intrusionDetection === null) return false;
    if (lc.intrusionDetection === 'no') return true;
    // Security schedule
    if (!lc.schedule.armFrom || !lc.schedule.armUntil) return false;
    if (scheduleExceedsArsCap(lc.schedule)) return false;
    if (lc.specialDays.writeInEnabled && !lc.specialDays.writeIn.trim()) return false;
    // Announcements are optional, but a choice needs a schedule
    if (lc.announcement && !lc.announcementSchedule) return false;
    // Detection functionality
    if (!lc.detect.human && !lc.detect.vehicle) return false;
    if (!lc.trigger) return false;
    if (lc.trigger === 'loiter' && !(lc.loiterSeconds >= 1 && lc.loiterSeconds <= 100)) return false;
    if (!lc.detectWhere.trim()) return false;
    if (!intelligentDeterrenceIncluded && !availableResponses.some(opt => lc.response[opt.field])) return false;
    return true;
  };

  const updateSiteConfig = (field, value) => {
    setConfig(prev => ({
      ...prev,
      siteConfig: { ...prev.siteConfig, [field]: value }
    }));
  };

  const handlePlacementMapChange = (e) => {
    const file = e.target.files && e.target.files[0];
    updateSiteConfig('placementMapName', file ? file.name : '');
  };

  const updateOnsiteContact = (field, value) => {
    setConfig(prev => ({
      ...prev,
      contactInfo: {
        ...prev.contactInfo,
        onsiteContact: { ...prev.contactInfo.onsiteContact, [field]: value }
      }
    }));
  };

  // Resolves to the primary contact when the onsite person is the same
  const resolvedOnsiteContact = config.contactInfo.onsiteContact.sameAsPrimary
    ? { name: config.contactInfo.fullName, phone: config.contactInfo.phone }
    : { name: config.contactInfo.onsiteContact.name, phone: config.contactInfo.onsiteContact.phone };

  const updateSalesRep = (field, value) => {
    setSalesRep(prev => ({ ...prev, [field]: value }));
  };

  const salesRepValid = salesRep.name.trim() && salesRep.email.trim();

  const submitSalesRepRequest = async () => {
    if (!salesRepValid || salesRep.submitting) return;
    setSalesRep(prev => ({ ...prev, submitting: true }));

    const payload = JSON.stringify({
      formType: 'sales_rep_inquiry',
      timestamp: new Date().toISOString(),
      name: salesRep.name,
      email: salesRep.email,
      phone: salesRep.phone,
      question: salesRep.question,
      // Where in the flow they asked for help
      stepNumber: currentStep + 1,
      stepName: steps[currentStep]
    });

    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        credentials: 'omit'
      });
    } catch (error) {
      // Cross-origin fallback — the request still reaches the endpoint
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: payload
        });
      } catch (fallbackError) {
        console.error('Sales rep request error:', fallbackError);
      }
    } finally {
      setSalesRep(prev => ({ ...prev, submitting: false, submitted: true }));
    }
  };

  const updateArs = (field, value) => {
    setConfig(prev => {
      const nextSiteConfig = {
        ...prev.siteConfig,
        ars: { ...prev.siteConfig.ars, [field]: value }
      };
      // Buying monitoring implies you want alerting, so answering yes turns
      // intrusion detection on for every location that has not said otherwise.
      if (field === 'enabled' && value === 'yes') {
        const nextConfigs = { ...nextSiteConfig.locationConfigs };
        prev.locations.forEach(location => {
          const lc = nextConfigs[location.id] || makeLocationConfig();
          if (lc.intrusionDetection === null) {
            nextConfigs[location.id] = { ...lc, intrusionDetection: 'yes' };
          }
        });
        nextSiteConfig.locationConfigs = nextConfigs;
      }
      return { ...prev, siteConfig: nextSiteConfig };
    });
  };

  const updateArsContact = (index, field, value) => {
    setConfig(prev => ({
      ...prev,
      siteConfig: {
        ...prev.siteConfig,
        ars: {
          ...prev.siteConfig.ars,
          contacts: prev.siteConfig.ars.contacts.map((contact, i) =>
            i === index ? { ...contact, [field]: value } : contact
          )
        }
      }
    }));
  };

  const updateGpsCoordinate = (index, field, value) => {
    setConfig(prev => {
      const list = [...prev.siteConfig.gpsCoordinates];
      while (list.length <= index) list.push({ lat: '', long: '' });
      list[index] = { ...list[index], [field]: value };
      return { ...prev, siteConfig: { ...prev.siteConfig, gpsCoordinates: list } };
    });
  };

  const canProceed = () => {
    if (currentStep === 0) {
      return config.locations.every(location =>
        location.zipCode.length === 5 && location.units.every(unit => unit.quantity > 0)
      );
    }
    if (currentStep === 1) {
      // The NDAA answer drives which SKUs are offered, so both are required
      return config.cameraConfig.ndaaRequired !== null && config.cameraConfig.sku !== null;
    }
    if (currentStep === 2) {
      // Hardware options are optional, but declining a recommended EFOY
      // generator requires acknowledging the downtime
      return declinedRecommendedLineCount === 0 || config.generatorBypass;
    }
    if (currentStep === 3) return true; // Software packages are optional
    if (currentStep === 4) return config.leaseTerm !== null; // Lease term required
    if (currentStep === 5) {
      // Contact info required
      const { email, phone, companyName, fullName, billingAddress, shippingAddresses } = config.contactInfo;
      const billingValid = billingAddress.street && billingAddress.city && 
                          billingAddress.state && billingAddress.zip;
      const shippingValid = uniqueLocationZips.length > 0
        ? uniqueLocationZips.every(zip => {
          const address = shippingAddresses.find(entry => entry.zipCode === zip);
          if (!address) return false;
          if (address.sameAsBilling) return true;
          return address.street && address.city && address.state && address.zip;
        })
        : false;
      // Onsite contact: only required when it is a different person
      const { onsiteContact } = config.contactInfo;
      const onsiteValid = onsiteContact.sameAsPrimary
        ? true
        : !!(onsiteContact.name && onsiteContact.phone);
      return email && phone && companyName && fullName && billingValid && shippingValid && onsiteValid;
    }
    if (currentStep === 6) {
      // Placement map and GPS are optional. Every location needs its analytics
      // configuration, and ARS needs a tier plus two contacts when enabled.
      const { ars } = config.siteConfig;
      if (ars.enabled === 'yes') {
        if (!ars.tier) return false;
        // A custom tier needs a description, otherwise the selection tells sales nothing
        if (ars.tier === 'custom' && !ars.customDetail.trim()) return false;
        if (!ars.contacts.every(contact => contact.name && contact.email && contact.phone)) return false;
      }
      return config.locations.every(location => locationConfigComplete(location.id));
    }
    return true;
  };

  const generatorUnits = config.locations.flatMap(location =>
    location.units
      .filter(unit => getUnitType(unit.unitType).generatorEligible && unit.needsGenerator)
      .map(unit => ({ ...unit, locationId: location.id, locationZip: location.zipCode }))
  );
  const generatorUnitCount = generatorUnits.reduce((sum, unit) => sum + (unit.quantity || 0), 0);
  // Generators are only billed when the customer has NOT opted to accept downtime
  // Generators are billed straight off the per-unit selections
  const billedGeneratorCount = generatorUnitCount;
  const generatorEligibleLines = config.locations.flatMap(location =>
    location.units
      .filter(unit => getUnitType(unit.unitType).generatorEligible)
      .map(unit => ({ ...unit, locationId: location.id }))
  );
  const recommendedGeneratorLineCount = generatorEligibleLines.filter(u => u.recommendedGenerator).length;
  const declinedRecommendedLineCount = generatorEligibleLines.filter(u => u.recommendedGenerator && !u.needsGenerator).length;
  const wallMountOnlyLocations = config.locations.filter(location =>
    location.units.length > 0 && location.units.every(unit => !getUnitType(unit.unitType).generatorEligible)
  );

  // Camera packages offered for the current NDAA answer. Requiring NDAA narrows
  // the list to compliant packages; not requiring it offers everything.
  // Each compliance mode offers exactly one package per range tier
  const availableCameras = config.cameraConfig.ndaaRequired === null
    ? []
    : CAMERA_OPTIONS.filter(option => option.ndaa === (config.cameraConfig.ndaaRequired === 'yes'));
  const selectedCamera = CAMERA_OPTIONS.find(option => option.sku === config.cameraConfig.sku) || null;

  // One row per physical unit, for per-unit camera overrides. `key` is stable
  // across quantity edits except for the units dropped off the end of a line.
  const cameraUnitList = config.locations
    .flatMap((location, locationIdx) =>
      location.units.flatMap(unit =>
        Array.from({ length: unit.quantity || 0 }, (_, n) => ({
          key: `${location.id}-${unit.id}-${n + 1}`,
          locationId: location.id,
          locationNumber: locationIdx + 1,
          locationName: locationLabel(location, locationIdx),
          zipCode: location.zipCode,
          unitTypeName: getUnitType(unit.unitType).name
        }))
      )
    )
    .map((u, i) => ({ ...u, unitNumber: i + 1 }));

  // The default applies unless a unit has an override
  const cameraSkuForUnit = (unitKey) => config.cameraConfig.overrides[unitKey] || config.cameraConfig.sku;
  const overriddenUnitCount = cameraUnitList.filter(u => config.cameraConfig.overrides[u.key]).length;
  const distinctCameraSkus = [...new Set(cameraUnitList.map(u => cameraSkuForUnit(u.key)).filter(Boolean))];
  const baseMonthlyTotal = config.locations.reduce((sum, location) => {
    const locationTotal = location.units.reduce((unitSum, unit) => {
      const unitType = getUnitType(unit.unitType);
      return unitSum + (unitType.baseMonthly * (unit.quantity || 0));
    }, 0);
    return sum + locationTotal;
  }, 0);

  // ---------------------------------------------------------------------------
  // Order model
  //
  // buildOrderModel() is the single typed representation of a submission:
  // booleans are booleans, numbers are numbers, repeated things are arrays.
  // Every outbound format is rendered FROM it, so a field is defined once:
  //   buildWebhookPayload()    -> the flat, human-readable object Workato receives
  //   buildHermesPayload()     -> the Hermes contract POSTed to hermes/serve.py
  // ---------------------------------------------------------------------------

  const buildOrderModel = ({ orderId, submittedAt }) => {
    const sc = config.siteConfig;
    const ci = config.contactInfo;
    const billing = ci.billingAddress;

    const shipping = ci.shippingAddresses.map(address => {
      const source = address.sameAsBilling ? billing : address;
      return {
        locationZip: address.zipCode,
        unitCount: unitsByZip[address.zipCode] || 0,
        sameAsBilling: !!address.sameAsBilling,
        street: source.street,
        city: source.city,
        state: source.state,
        zip: source.zip
      };
    });

    const locations = config.locations.map((location, idx) => ({
      locationNumber: idx + 1,
      locationName: locationLabel(location, idx),
      zipCode: location.zipCode,
      units: location.units.map(unit => {
        const unitType = getUnitType(unit.unitType);
        return {
          unitTypeId: unit.unitType,
          unitTypeName: unitType.name,
          quantity: unit.quantity || 0,
          needsGenerator: !!(unitType.generatorEligible && unit.needsGenerator),
          baseMonthlyPerUnit: unitType.baseMonthly
        };
      })
    }));

    // One entry per physical unit, index-aligned with the GPS inputs
    const gps = gpsUnitList.map((u, i) => {
      const coord = sc.gpsCoordinates[i] || { lat: '', long: '' };
      const asNumber = (v) => {
        const n = parseFloat(v);
        return v !== '' && !Number.isNaN(n) ? n : null;
      };
      return {
        unitNumber: i + 1,
        unitTypeName: u.typeName,
        locationName: u.locationName || null,
        zipCode: u.zip,
        latitude: asNumber(coord.lat),
        longitude: asNumber(coord.long)
      };
    });

    const arsTier = sc.ars.enabled === 'yes' && sc.ars.tier ? getArsTier(sc.ars.tier) : null;
    const leaseTermOption = leaseTerms.find(t => t.months === config.leaseTerm) || null;

    const model = {
      meta: {
        orderId,
        submittedAt: submittedAt.toISOString(),
        source: 'online-configurator'
      },
      account: {
        companyName: ci.companyName
      },
      contacts: {
        primary: { name: ci.fullName, email: ci.email, phone: ci.phone },
        onsite: {
          sameAsPrimary: !!ci.onsiteContact.sameAsPrimary,
          name: resolvedOnsiteContact.name,
          phone: resolvedOnsiteContact.phone
        },
        arsEscalation: arsTier
          ? sc.ars.contacts.map((c, i) => ({
              position: i + 1, name: c.name, email: c.email, phone: c.phone
            }))
          : []
      },
      addresses: { billing: { ...billing }, shipping },
      deployment: { totalUnits, locations, gpsCoordinates: gps },
      cameras: {
        // null until the customer answers; true/false once they do
        ndaaRequired: config.cameraConfig.ndaaRequired === null
          ? null
          : config.cameraConfig.ndaaRequired === 'yes',
        // The default package applied to every unit without an override
        defaultSku: selectedCamera ? selectedCamera.sku : null,
        defaultOptionName: selectedCamera ? selectedCamera.name : null,
        defaultLabel: selectedCamera ? selectedCamera.label : null,
        defaultCapability: selectedCamera ? selectedCamera.capability : null,
        // True when units do not all resolve to the same package
        mixed: distinctCameraSkus.length > 1,
        overriddenUnitCount,
        perUnit: cameraUnitList.map(u => {
          const sku = cameraSkuForUnit(u.key);
          const option = CAMERA_OPTIONS.find(o => o.sku === sku) || null;
          return {
            unitNumber: u.unitNumber,
            locationNumber: u.locationNumber,
            zipCode: u.zipCode,
            unitTypeName: u.unitTypeName,
            sku: sku || null,
            optionName: option ? option.name : null,
            label: option ? option.label : null,
            ndaaCompliantPackage: option ? option.ndaa : null,
            isOverride: !!config.cameraConfig.overrides[u.key]
          };
        })
      },
      hardware: {
        lpr: !!config.lpr,
        satCom: !!config.satCom,
        generator: {
          recommendedCount: generatorUnitCount,
          billedCount: billedGeneratorCount,
          declined: !!config.generatorBypass,
          downtimeAccepted: !!config.generatorBypass,
          monthlyPerGenerator: GENERATOR_MONTHLY
        }
      },
      software: {
        packages: config.softwarePackages
          .map(id => softwarePackages.find(p => p.id === id))
          .filter(Boolean)
          .map(pkg => ({ id: pkg.id, name: pkg.name, monthlyPerUnit: pkg.monthlyPrice }))
      },
      ars: {
        enabled: sc.ars.enabled === 'yes',
        tierId: arsTier ? arsTier.value : null,
        tierLabel: arsTier ? arsTier.label : null,
        coverage: arsTier ? arsTier.coverage : null,
        customDetail: arsTier && arsTier.value === 'custom' ? sc.ars.customDetail : null,
        ratePerUnit: arsTier && arsTier.monthly ? arsTier.monthly : 0,
        monthlyCharge: arsTier && arsTier.monthly ? arsTier.monthly * totalUnits : 0,
        quotedSeparately: !!(arsTier && !arsTier.monthly)
      },
      site: {
        placementMap: {
          fileName: sc.placementMapLater ? null : (sc.placementMapName || null),
          deferred: !!sc.placementMapLater,
          // The file itself is not transmitted — only its name. See notes in the PR.
          fileIncluded: false
        },
        schedule: {
          perLocation: config.locations.map((location, idx) => {
            const lc = sc.locationConfigs[location.id] || makeLocationConfig();
            const on = lc.intrusionDetection === 'yes';
            return {
              locationNumber: idx + 1,
              locationName: locationLabel(location, idx),
              zipCode: location.zipCode,
              intrusionDetection: lc.intrusionDetection === null ? null : on,
              idleStrobeLight: lc.idleStrobe,
              schedule: on ? { armFrom: lc.schedule.armFrom || null, armUntil: lc.schedule.armUntil || null } : null,
              alertingMinutesPerDay: on ? scheduleMinutes(lc.schedule) : null,
              specialDays: on ? {
                allAnnualHolidays: !!lc.specialDays.allHolidays,
                writeIn: lc.specialDays.writeInEnabled ? (lc.specialDays.writeIn || null) : null
              } : null,
              announcement: on && lc.announcement ? {
                type: lc.announcement,
                schedule: lc.announcementSchedule
              } : null,
              detection: on ? {
                objects: [lc.detect.human ? 'Humans' : null, lc.detect.vehicle ? 'Vehicles' : null].filter(Boolean),
                trigger: lc.trigger,
                loiterSeconds: lc.trigger === 'loiter' ? lc.loiterSeconds : null,
                zones: lc.detectWhere || null,
                response: intelligentDeterrenceIncluded
                  ? ['Intelligent Deterrence']
                  : DETECTION_RESPONSES.filter(r => lc.response[r.field]).map(r => r.label)
              } : null
            };
          })
        },
        areasOfConcern: sc.areasOfConcern || null
      },
      lease: {
        termMonths: config.leaseTerm,
        discountRate: leaseTermOption ? leaseTermOption.discount : 0,
        baseMonthlyTotal,
        monthlyPayment: Math.round(calculateMonthlyTotal()),
        totalContract: calculateContractTotal()
      }
    };

    return model;
  };

  // Salesforce-shaped fields. Values this configurator cannot know are null and
  // listed in `unresolved` rather than guessed — see the notes on each.
  // --- Hermes order contract -------------------------------------------------
  //
  // The seam between this portal and the deterministic script that writes the
  // Salesforce Opportunity + CPQ Quote (see hermes/). Hermes validates this
  // payload, resolves the UUIDs, and refuses the order outright if anything is
  // ambiguous — it never guesses at an account. This contract replaces the
  // earlier buildSalesforceRecord() mapping.
  //
  // DEMO LIMITATION: this portal has no authentication, so it cannot prove who is
  // ordering. One known sandbox account is pinned below so the existing-customer
  // path stays demonstrable. Production needs an authenticated VMS admin session
  // supplying these ids; do not ship the pinned pair.
  //
  // Any OTHER company name is treated as a new customer: no ids are sent, and
  // Hermes provisions the account structure rather than filing the order under the
  // pinned account. That provisioning mints LVT ids VMS does not know about, so a
  // new account arrives flagged for reconciliation.
  const HERMES_DEMO_ACCOUNT = {
    companyName: 'Brasfield & Gorrie',
    lvt_customer_id: '338654e0-4f4a-c8d9-b7e9-c7f7446318bd', // Brasfield & Gorrie- GA
    lvt_location_id: '64fe394f-eee6-269c-d810-08133aef8258'  // ...- Cartersville GA
  };

  const isPinnedDemoAccount = () =>
    (config.contactInfo.companyName || '').trim().toLowerCase() ===
    HERMES_DEMO_ACCOUNT.companyName.toLowerCase();

  // Portal package ids do not match the CPQ product names, and CPQ also carries a
  // legacy module whose name collides with one of ours. Send the display name so
  // Hermes resolves against the right product.
  const hermesSoftwareNames = () =>
    config.softwarePackages
      .map(id => (softwarePackages.find(pkg => pkg.id === id) || {}).name)
      .filter(Boolean);

  const buildHermesPayload = (model) => ({
    order_id: model.meta.orderId,
    submitted_at: model.meta.submittedAt,
    submitted_by: {
      email: config.contactInfo.email,
      company_name: config.contactInfo.companyName,
      // Null for anyone but the pinned demo account, which is what tells Hermes to
      // provision a new account instead of filing under an existing one.
      lvt_customer_id: isPinnedDemoAccount() ? HERMES_DEMO_ACCOUNT.lvt_customer_id : null,
      billing_address: { ...model.addresses.billing }
    },
    order: {
      term_months: model.lease.termMonths,
      po_number: null,
      // v1 targets a single location. Every configured unit is attributed to it
      // rather than inventing a UUID per zip code we cannot resolve.
      locations: [
        {
          lvt_location_id: isPinnedDemoAccount() ? HERMES_DEMO_ACCOUNT.lvt_location_id : null,
          zip_code: (config.locations[0] || {}).zipCode || null,
          units: model.deployment.locations.flatMap(location =>
            location.units.map(unit => ({
              // Sent verbatim. Hermes only accepts 'mobile' and 'wall' today, so a
              // Guardgate is rejected rather than silently filed as something else.
              unit_type: unit.unitTypeId,
              quantity: unit.quantity,
              needs_generator: !!unit.needsGenerator
            }))
          )
        }
      ],
      hardware_options: {
        // Hermes selects between an Axis (NDAA) and Dahua (non-NDAA) head unit
        ndaa_compliant: model.cameras.ndaaRequired === true,
        lpr: model.hardware.lpr,
        sat_com: model.hardware.satCom
      },
      // The specific packages the customer chose. Hermes currently resolves a head
      // unit from ndaa_compliant alone; these SKUs are the authoritative selection.
      cameras: {
        default_sku: model.cameras.defaultSku,
        mixed: model.cameras.mixed,
        per_unit: model.cameras.perUnit.map(u => ({
          unit: u.unitNumber,
          zip_code: u.zipCode,
          sku: u.sku
        }))
      },
      software_packages: hermesSoftwareNames(),
      alert_response_services: model.ars.enabled ? {
        tier: model.ars.tierId,
        coverage: model.ars.coverage,
        custom_detail: model.ars.customDetail,
        rate_per_unit: model.ars.ratePerUnit,
        monthly_charge: model.ars.monthlyCharge
      } : null
    },
    contacts: {
      billing: { ...model.contacts.primary },
      shipping: { ...model.contacts.primary },
      onsite: { ...model.contacts.onsite },
      ars_escalation: model.contacts.arsEscalation
    },
    site_config: {
      placement_map: model.site.placementMap,
      areas_of_concern: model.site.areasOfConcern,
      per_location: model.site.schedule.perLocation,
      gps_coordinates: model.deployment.gpsCoordinates
    },
    // Displayed figures travel with the order so a rep can see what the customer was
    // shown. They are NOT inputs to pricing — the quote is built at CPQ list price.
    portal_estimate: {
      monthly: model.lease.monthlyPayment,
      contract_total: Math.round(model.lease.totalContract),
      disclaimer: 'Non-binding estimate. The Salesforce quote is priced from the CPQ price book and will differ.'
    }
  });

  // Posts the contract straight to the Hermes API. hermes/serve.py serves this
  // portal and exposes the endpoint on the same origin, so a relative URL keeps
  // the request same-origin and avoids CORS entirely.
  //
  // Responses (see hermes/serve.py):
  //   200 { ok: true,  ...summary }   the Opportunity and Quote were written
  //   422 { ok: false, rejected: true, code, field, detail }   Hermes refused it
  //   4xx/5xx { ok: false, error }    bad request, or the pipeline failed
  const HERMES_ENDPOINT = '/api/order';

  const submitToHermes = async (payload) => {
    try {
      const response = await fetch(HERMES_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      let body = null;
      try {
        body = await response.json();
      } catch (parseError) {
        // A non-JSON body means something other than Hermes answered — most
        // likely the portal is being served by a plain static file server.
        return {
          ok: false,
          reachable: false,
          message: 'Hermes did not respond with JSON. Is the portal being served by hermes/serve.py?'
        };
      }

      if (response.ok && body && body.ok) {
        return { ok: true, reachable: true, summary: body };
      }

      if (body && body.rejected) {
        return {
          ok: false,
          reachable: true,
          rejected: true,
          message: `${body.code}${body.field ? ` (${body.field})` : ''}: ${body.detail}`
        };
      }

      return {
        ok: false,
        reachable: true,
        message: (body && body.error) || `Hermes returned HTTP ${response.status}.`
      };
    } catch (error) {
      // fetch only rejects on a transport failure, so the server is not running
      console.error('[hermes] request failed:', error);
      return {
        ok: false,
        reachable: false,
        message: 'Could not reach Hermes. Start it with: python3 -m hermes.serve'
      };
    }
  };

  // Reads a Hermes success summary into something worth showing the customer
  const describeHermesResult = (summary) => {
    if (!summary) return '';
    if (summary.dry_run) {
      return `Dry run — no records written.\nBilling account: ${summary.billing_account}\nUnits: ${summary.total_units}`;
    }
    const lines = [];
    if (summary.opportunity_name) lines.push(`Opportunity: ${summary.opportunity_name}`);
    if (summary.account_name) lines.push(`Account: ${summary.account_name}`);
    if (summary.quote_name) lines.push(`Quote: ${summary.quote_name}`);
    if (typeof summary.quote_net_amount === 'number') {
      lines.push(`Quote total: $${summary.quote_net_amount.toLocaleString()}`);
    }
    if (summary.provisioned) lines.push('A new account structure was provisioned.');
    if (summary.already_existed) lines.push('An Opportunity for this order already existed.');
    (summary.warnings || []).forEach(w => lines.push(`Warning: ${w}`));
    return lines.join('\n');
  };

  // Renders the flat, human-readable object the Workato webhook already expects.
  const buildWebhookPayload = (model) => {
    const yn = (v) => (v ? 'Yes' : 'No');
    const addressFull = (a) => `${a.street}, ${a.city}, ${a.state} ${a.zip}`;

    const unitLines = model.deployment.locations.flatMap(loc =>
      loc.units.map(unit => ({ loc, unit }))
    );
    const shippingByZip = model.addresses.shipping.reduce((acc, a) => {
      acc[a.locationZip] = a;
      return acc;
    }, {});

    return {
      // Order Info
      timestamp: model.meta.submittedAt,
      orderId: model.meta.orderId,

      // Configuration Summary
      unitCount: model.deployment.totalUnits,
      baseMonthlyTotal: model.lease.baseMonthlyTotal,
      deploymentZips: model.deployment.locations.map(l => l.zipCode).join(', '),
      deploymentDetails: unitLines.map(({ loc, unit }) =>
        `${loc.locationName}: ${unit.quantity} ${unit.quantity === 1 ? 'Unit' : 'Units'} • ${unit.unitTypeName} • Zip ${loc.zipCode}${unit.needsGenerator ? ' (+ EFOY Generator)' : ''}`
      ).join(' | '),
      unitBreakdown: unitLines.map(({ loc, unit }) => {
        const ship = shippingByZip[loc.zipCode] || null;
        return {
          location: loc.locationNumber,
          locationName: loc.locationName,
          unitType: unit.unitTypeName,
          quantity: unit.quantity,
          zipCode: loc.zipCode,
          needsGenerator: yn(unit.needsGenerator),
          shippingAddress: ship
            ? {
                locationZip: ship.locationZip,
                unitCount: ship.unitCount,
                sameAsBilling: yn(ship.sameAsBilling),
                street: ship.street,
                city: ship.city,
                state: ship.state,
                zip: ship.zip,
                addressFull: addressFull(ship)
              }
            : null
        };
      }),
      generatorsNeeded: model.hardware.generator.recommendedCount,

      // Hardware Options
      ndaaRequired: model.cameras.ndaaRequired === null ? 'Not answered' : yn(model.cameras.ndaaRequired),
      // Scalars kept for existing consumers: the SKU when every unit matches,
      // otherwise 'Mixed' — see cameraSkusByUnit for the authoritative per-unit list
      cameraSku: model.cameras.mixed ? 'Mixed' : (model.cameras.defaultSku || 'Not selected'),
      cameraDescriptor: model.cameras.mixed ? 'Mixed — see cameraSkusByUnit' : (model.cameras.defaultLabel || 'Not selected'),
      cameraDefaultSku: model.cameras.defaultSku || 'Not selected',
      cameraOptionName: model.cameras.mixed ? 'Mixed' : (model.cameras.defaultOptionName || 'Not selected'),
      cameraOverriddenUnits: model.cameras.overriddenUnitCount,
      cameraSkusByUnit: model.cameras.perUnit.map(u => ({
        unit: u.unitNumber,
        location: u.locationNumber,
        zipCode: u.zipCode,
        unitType: u.unitTypeName,
        sku: u.sku || 'Not selected',
        optionName: u.optionName || 'Not selected',
        descriptor: u.label || 'Not selected',
        isOverride: yn(u.isOverride)
      })),
      lpr: yn(model.hardware.lpr),
      satCom: yn(model.hardware.satCom),
      generatorDeclined: yn(model.hardware.generator.declined),
      generatorDowntimeAccepted: model.hardware.generator.declined ? 'Yes' : 'N/A',
      generatorsBilled: model.hardware.generator.billedCount,

      // Software Packages
      softwarePackages: model.software.packages.length > 0
        ? model.software.packages.map(p => p.id).join(', ')
        : 'None',

      // Site Configuration
      placementMap: model.site.placementMap.deferred
        ? 'To be determined later'
        : (model.site.placementMap.fileName || 'Not provided'),
      arsEnabled: yn(model.ars.enabled),
      arsTier: model.ars.tierLabel || 'N/A',
      arsCoverage: model.ars.coverage || 'N/A',
      arsCustomDetail: model.ars.customDetail || 'N/A',
      arsRatePerUnit: model.ars.ratePerUnit,
      arsMonthlyCharge: model.ars.monthlyCharge,
      arsContacts: model.contacts.arsEscalation.map(c => ({
        contact: c.position, name: c.name, email: c.email, phone: c.phone
      })),
      gpsCoordinates: model.deployment.gpsCoordinates.length > 0
        ? model.deployment.gpsCoordinates.map(g =>
            `Unit ${g.unitNumber} (${g.unitTypeName}${g.zipCode ? `, Zip ${g.zipCode}` : ''}): ${g.latitude !== null ? g.latitude.toFixed(6) : '—'}, ${g.longitude !== null ? g.longitude.toFixed(6) : '—'}`
          ).join(' | ')
        : 'None',
      locationAnalytics: model.site.schedule.perLocation.map(l => ({
        location: l.locationNumber,
        locationName: l.locationName,
        zipCode: l.zipCode,
        intrusionDetection: l.intrusionDetection === null ? 'Not answered' : (l.intrusionDetection ? 'Yes' : 'No'),
        idleStrobeLight: l.idleStrobeLight ? (l.idleStrobeLight === 'on' ? 'On' : 'Off') : 'Not answered',
        armedFrom: l.schedule ? l.schedule.armFrom : 'N/A',
        armedUntil: l.schedule ? l.schedule.armUntil : 'N/A',
        alertingHoursPerDay: l.alertingMinutesPerDay !== null ? +(l.alertingMinutesPerDay / 60).toFixed(2) : 'N/A',
        allAnnualHolidays: l.specialDays ? (l.specialDays.allAnnualHolidays ? 'Yes' : 'No') : 'N/A',
        specialDaysWriteIn: l.specialDays && l.specialDays.writeIn ? l.specialDays.writeIn : 'None',
        announcement: l.announcement ? l.announcement.type : 'None',
        announcementSchedule: l.announcement ? l.announcement.schedule : 'N/A',
        detectObjects: l.detection ? l.detection.objects.join(', ') : 'N/A',
        alertTrigger: l.detection ? l.detection.trigger : 'N/A',
        loiterSeconds: l.detection && l.detection.loiterSeconds !== null ? l.detection.loiterSeconds : 'N/A',
        detectionZones: l.detection ? (l.detection.zones || 'Not specified') : 'N/A',
        detectionResponse: l.detection ? l.detection.response.join(', ') : 'N/A'
      })),
      areasOfConcern: model.site.areasOfConcern || 'None provided',

      // Lease Details
      leaseTerm: model.lease.termMonths + ' months',
      monthlyPayment: model.lease.monthlyPayment,
      totalContract: model.lease.totalContract,

      // Contact Information
      companyName: model.account.companyName,
      contactName: model.contacts.primary.name,
      email: model.contacts.primary.email,
      phone: model.contacts.primary.phone,

      // Onsite Contact
      onsiteContactSameAsPrimary: yn(model.contacts.onsite.sameAsPrimary),
      onsiteContactName: model.contacts.onsite.name,
      onsiteContactPhone: model.contacts.onsite.phone,

      // Billing Address
      billingStreet: model.addresses.billing.street,
      billingCity: model.addresses.billing.city,
      billingState: model.addresses.billing.state,
      billingZip: model.addresses.billing.zip,
      billingAddressFull: addressFull(model.addresses.billing),

      // Shipping Addresses
      shippingAddresses: model.addresses.shipping.map(a => ({
        locationZip: a.locationZip,
        unitCount: a.unitCount,
        sameAsBilling: yn(a.sameAsBilling),
        street: a.street,
        city: a.city,
        state: a.state,
        zip: a.zip,
        addressFull: addressFull(a)
      }))
    };
  };

  return (
    <div className="app-shell">
      <div className="noise-bg"></div>

      {/* Header */}
      <header className="app-header">
        <div className="header-left">
          <div className="header-brand">
            <svg 
              xmlns="http://www.w3.org/2000/svg" 
              width="60" 
              height="28"
              viewBox="0 0 76 36" 
              fill="none" 
              className="logo"
              style={{ color: '#ffffff' }}
            >
              <path d="M14.1675 0.521484L29.4019 35.5215H29.4528H39.1845L23.9501 0.521484H14.1675Z" fill="currentColor"></path>
              <path d="M9.45465 27.2862V0.521484H0.5V35.5215H24.6763L21.097 27.2862H9.45465Z" fill="currentColor"></path>
              <path d="M44.6873 0.521484L36.6753 18.9222L41.5666 30.1557L50.8779 8.75678H55.5654V35.5215H64.5201V8.75678H71.9207L75.5 0.521484H44.6873Z" fill="currentColor"></path>
            </svg>
            <div>
              <div style={{ 
                fontSize: '9px', 
                fontWeight: '600',
                letterSpacing: '0.5px',
                color: 'rgba(255,255,255,0.6)',
                textTransform: 'uppercase'
              }}>
                LiveView Technologies
              </div>
            </div>
          </div>
          <div className="header-divider"></div>
          <div className="header-subtitle">
            Configure Your Security System
          </div>
        </div>
        <div className="steps-nav">
          {steps.map((step, idx) => (
            <div
              key={step}
              className={`step-indicator ${idx === currentStep ? 'active' : ''}`}
              style={{
                opacity: idx === currentStep ? 1 : 0.4,
                color: idx <= currentStep ? '#56d3cc' : '#fff',
                textTransform: 'uppercase'
              }}
            >
              {step}
            </div>
          ))}
        </div>
      </header>

      {/* Main Content */}
      <main className="main-content">
        
        {/* Step 0: Location */}
        {currentStep === 0 && (
          <div>
            <h1 className="marketplace-title">
              LVT Marketplace
            </h1>
            <h2 className="hero-title">
              Surveillance, Deterrence, <br />and Versatility
            </h2>
            <p className="hero-intro">
              Meet LVT's lineup of intelligent security solutions, each leveraging AI to deter crime automatically. Rapidly-deployable as mobile units, wall mounts, or Guardgates, every unit is expertly configured to match your specific security needs.
            </p>

            <div className="hero-grid">
              {/* Product Details */}
              <div className="product-details">
                <h3 className="product-title">
                  Security Unit Lineup
                </h3>
                
                <p className="product-copy">
                  Select the right unit type for each deployment location below. Mobile units and Guardgates support generator backup; wall mounts do not require a generator.

                      <span>
                        {unit.name} • ${unit.baseMonthly.toLocaleString()}/mo

                  ))}
                </ul>

                <div className="price-amount">
                  Starting at $1,500

            </div>

            {/* Units Configuration Section */}
            <div
              className="units-config-card"
              style={{
              background: 'rgba(255,255,255,0.03)',
