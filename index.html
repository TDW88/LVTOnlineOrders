                    borderRadius: '10px',
                    fontSize: '16px',
                    fontWeight: '800',
                    cursor: isSubmitting ? 'not-allowed' : 'pointer',
                    transition: 'all 0.3s ease',
                    textTransform: 'uppercase',
                    letterSpacing: '0.5px',
                    marginBottom: '16px',
                    opacity: isSubmitting ? 0.7 : 1
                  }}
                  onMouseOver={(e) => {
                    if (!isSubmitting) {
                      e.target.style.background = '#00a19a';
                      e.target.style.transform = 'scale(1.02)';
                    }
                  }}
                  onMouseOut={(e) => {
                    if (!isSubmitting) {
                      e.target.style.background = '#56d3cc';
                      e.target.style.transform = 'scale(1)';
                    }
                  }}
                  onClick={async () => {
                    if (isSubmitting) return;
                    
                    setIsSubmitting(true);
                    
                    const webhookUrl = WEBHOOK_URL;
                    
                    const monthlyTotal = Math.round(calculateMonthlyTotal());
                    const contractTotal = calculateContractTotal();
                    
                    const submittedAt = new Date();
                    const orderModel = buildOrderModel({
                      orderId: `LVT-${submittedAt.getTime()}`,
                      submittedAt
                    });
                    const orderData = buildWebhookPayload(orderModel);

                    // File the order with Hermes, which writes the Opportunity and Quote
                    const hermesResult = await submitToHermes(buildHermesPayload(orderModel));
                    
                    const payload = JSON.stringify(orderData);
                    let submitted = false;
                    let verified = false;

                    try {
                      const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: payload,
                        credentials: 'omit'
                      });
                      submitted = response.ok;
                      verified = response.ok;
                    } catch (error) {
                      try {
                        await fetch(webhookUrl, {
                          method: 'POST',
                          mode: 'no-cors',
                          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                          body: payload
                        });
                        submitted = true;
                      } catch (fallbackError) {
                        console.error('Submission error:', fallbackError);
                      }
                      console.error('Submission error:', error);
                    } finally {
                      // The order counts as placed when HERMES filed it — that is the
                      // Opportunity and Quote in Salesforce, the record of truth.
                      // Previously this was gated on the Workato webhook instead, so a
                      // successfully filed order whose webhook failed told the customer
                      // it had errored, inviting a resubmission and a duplicate order.
                      setOrderConfirmation({
                        placed: hermesResult.ok,
                        orderId: orderData.orderId,
                        units: totalUnits,
                        termMonths: config.leaseTerm,
                        monthly: monthlyTotal,
                        contractTotal,
                        email: config.contactInfo.email,
                        hermes: hermesResult,
                        webhookSubmitted: submitted,
                        webhookVerified: verified
                      });
                      setIsSubmitting(false);
                    }
                  }}
                >
                  {isSubmitting
                    ? 'Submitting...'
                    : orderConfirmation && orderConfirmation.placed
                      ? 'Order Placed'
                      : 'Submit Order'}
                </button>
                
                <div style={{
                  fontSize: '12px',
                  color: 'rgba(255,255,255,0.6)',
                  textAlign: 'center',
                  lineHeight: '1.4'
                }}>
                  Installation, training, and ongoing support included · Shipping and set-up billed separately
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Navigation Buttons */}
        <div style={{
          marginTop: '64px',
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'center',
          position: 'relative',
          zIndex: 100
        }}>
          <button
            onClick={() => currentStep > 0 && setCurrentStep(currentStep - 1)}
            disabled={currentStep === 0}
            style={{
              padding: '14px 28px',
              background: currentStep === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.08)',
              color: currentStep === 0 ? 'rgba(255,255,255,0.3)' : '#fff',
              border: '2px solid rgba(255,255,255,0.15)',
              borderRadius: '10px',
              fontSize: '14px',
              fontWeight: '700',
              cursor: currentStep === 0 ? 'not-allowed' : 'pointer',
              transition: 'all 0.3s ease',
              textTransform: 'uppercase',
              letterSpacing: '0.5px'
            }}
            onMouseOver={(e) => {
              if (currentStep > 0) {
                e.target.style.background = 'rgba(255,255,255,0.12)';
              }
            }}
            onMouseOut={(e) => {
              if (currentStep > 0) {
                e.target.style.background = 'rgba(255,255,255,0.08)';
              }
            }}
          >
            ← Back
          </button>
          
          {currentStep < 7 ? (
            <button
              onClick={() => {
                if (currentStep === 0 && canProceed()) {
                  handleZipCodeSubmit();
                } else if (canProceed()) {
                  setCurrentStep(currentStep + 1);
                }
              }}
              disabled={!canProceed()}
              style={{
                padding: '14px 40px',
                background: !canProceed() 
                  ? 'rgba(86, 211, 204, 0.2)' 
                  : '#56d3cc',
                color: !canProceed() ? 'rgba(255,255,255,0.4)' : '#fff',
                border: 'none',
                borderRadius: '10px',
                fontSize: '14px',
                fontWeight: '800',
                cursor: !canProceed() ? 'not-allowed' : 'pointer',
                transition: 'all 0.3s ease',
                textTransform: 'uppercase',
                letterSpacing: '0.5px'
              }}
              onMouseOver={(e) => {
                if (canProceed()) {
                  e.target.style.background = '#00a19a';
                  e.target.style.transform = 'scale(1.02)';
                }
              }}
              onMouseOut={(e) => {
                if (canProceed()) {
                  e.target.style.background = '#56d3cc';
                  e.target.style.transform = 'scale(1)';
                }
              }}
            >
              Continue →
            </button>
          ) : (
            <button
              onClick={() => setCurrentStep(0)}
              style={{
                padding: '14px 40px',
                background: 'rgba(255,255,255,0.08)',
                color: '#fff',
                border: '2px solid rgba(255,255,255,0.15)',
                borderRadius: '10px',
                fontSize: '14px',
                fontWeight: '700',
                cursor: 'pointer',
                transition: 'all 0.3s ease',
                textTransform: 'uppercase',
                letterSpacing: '0.5px'
              }}
              onMouseOver={(e) => {
                e.target.style.background = 'rgba(255,255,255,0.12)';
              }}
              onMouseOut={(e) => {
                e.target.style.background = 'rgba(255,255,255,0.08)';
              }}
            >
              Start Over
            </button>
          )}
        </div>

        {/* Talk to a Sales Rep — available on every step */}
        <div style={{
          marginTop: '56px',
          maxWidth: '800px',
          marginLeft: 'auto',
          marginRight: 'auto',
          background: 'rgba(255,255,255,0.03)',
          border: '1px solid rgba(255,255,255,0.12)',
          borderRadius: '16px',
          padding: '28px 32px'
        }}>
          {salesRep.submitted ? (
            <div style={{ textAlign: 'center' }}>
              <CheckCircle style={{ color: '#56d3cc', width: '32px', height: '32px' }} />
              <div style={{
                fontSize: '18px',
                fontWeight: '800',
                marginTop: '12px',
                marginBottom: '6px'
              }}>
                Thanks — we'll be in touch shortly.
              </div>
              <div style={{ fontSize: '14px', color: 'rgba(255,255,255,0.6)' }}>
                An LVT sales rep will reach out to {salesRep.email}. Your configuration has been saved, so you can keep going where you left off.
              </div>
            </div>
          ) : (
            <React.Fragment>
              <div
                onClick={() => updateSalesRep('open', !salesRep.open)}
                style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  gap: '16px',
                  cursor: 'pointer'
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                  <Headset width={24} height={24} style={{ color: '#56d3cc' }} />
                  <div style={{
                    fontSize: '17px',
                    fontWeight: '800',
                    letterSpacing: '-0.2px'
                  }}>
                    Have Questions? Talk to an LVT Sales Rep Directly!
                  </div>
                </div>
                <div style={{
                  fontSize: '13px',
                  fontWeight: '700',
                  color: '#56d3cc',
                  textTransform: 'uppercase',
                  letterSpacing: '0.5px',
                  whiteSpace: 'nowrap'
                }}>
                  {salesRep.open ? 'Close' : 'Contact Us'}
                </div>
              </div>

              {salesRep.open && (
                <div style={{
                  marginTop: '24px',
                  paddingTop: '24px',
                  borderTop: '1px solid rgba(255,255,255,0.1)'
                }}>
                  <p style={{
                    fontSize: '14px',
                    color: 'rgba(255,255,255,0.6)',
                    marginBottom: '20px',
                    lineHeight: '1.6'
                  }}>
                    Leave your details and a rep will get back to you. You won't lose your progress.
                  </p>
                  <div
                    className="contact-grid"
                    style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', marginBottom: '16px' }}
                  >
                    {[
                      { label: 'Name *', field: 'name', type: 'text', placeholder: 'Full Name' },
                      { label: 'Email Address *', field: 'email', type: 'email', placeholder: 'your.email@company.com' },
                      { label: 'Phone Number', field: 'phone', type: 'tel', placeholder: '(555) 555-5555' }
                    ].map(cell => (
                      <div key={cell.field}>
                        <label style={{
                          display: 'block',
                          fontSize: '12px',
                          fontWeight: '700',
                          textTransform: 'uppercase',
                          letterSpacing: '0.5px',
                          marginBottom: '8px',
                          color: 'rgba(255,255,255,0.7)'
                        }}>
                          {cell.label}
                        </label>
                        <input
                          type={cell.type}
                          value={salesRep[cell.field]}
                          onChange={(e) => updateSalesRep(cell.field, e.target.value)}
                          placeholder={cell.placeholder}
                          style={{
                            width: '100%',
                            padding: '12px 16px',
                            background: 'rgba(39, 42, 47, 0.6)',
                            border: '2px solid rgba(255,255,255,0.15)',
                            borderRadius: '8px',
                            color: '#fff',
                            fontSize: '16px',
                            fontWeight: '500',
                            outline: 'none',
                            transition: 'all 0.3s ease'
                          }}
                          onFocus={(e) => {
                            e.target.style.border = '2px solid #56d3cc';
                            e.target.style.background = 'rgba(86, 211, 204, 0.08)';
                          }}
                          onBlur={(e) => {
                            e.target.style.border = '2px solid rgba(255,255,255,0.15)';
                            e.target.style.background = 'rgba(39, 42, 47, 0.6)';
                          }}
                        />
                      </div>
                    ))}
                  </div>

                  <label style={{
                    display: 'block',
                    fontSize: '12px',
                    fontWeight: '700',
                    textTransform: 'uppercase',
                    letterSpacing: '0.5px',
                    marginBottom: '8px',
                    color: 'rgba(255,255,255,0.7)'
                  }}>
                    What can we help with?
                  </label>
                  <textarea
                    value={salesRep.question}
                    onChange={(e) => updateSalesRep('question', e.target.value)}
                    placeholder="Ask us anything about pricing, hardware, or deployment..."
                    rows={3}
                    style={{
                      width: '100%',
                      padding: '14px 16px',
                      background: 'rgba(39, 42, 47, 0.6)',
                      border: '2px solid rgba(255,255,255,0.15)',
                      borderRadius: '8px',
                      color: '#fff',
                      fontSize: '16px',
                      fontWeight: '500',
                      fontFamily: 'inherit',
                      lineHeight: '1.6',
                      outline: 'none',
                      resize: 'vertical',
                      marginBottom: '20px',
                      transition: 'all 0.3s ease'
                    }}
                    onFocus={(e) => {
                      e.target.style.border = '2px solid #56d3cc';
                      e.target.style.background = 'rgba(86, 211, 204, 0.08)';
                    }}
                    onBlur={(e) => {
                      e.target.style.border = '2px solid rgba(255,255,255,0.15)';
                      e.target.style.background = 'rgba(39, 42, 47, 0.6)';
                    }}
                  />

                  <button
                    onClick={submitSalesRepRequest}
                    disabled={!salesRepValid || salesRep.submitting}
                    style={{
                      padding: '14px 32px',
                      background: (!salesRepValid || salesRep.submitting) ? 'rgba(86, 211, 204, 0.2)' : '#56d3cc',
                      color: (!salesRepValid || salesRep.submitting) ? 'rgba(255,255,255,0.4)' : '#1b1e23',
                      border: 'none',
                      borderRadius: '10px',
                      fontSize: '14px',
                      fontWeight: '800',
                      cursor: (!salesRepValid || salesRep.submitting) ? 'not-allowed' : 'pointer',
                      transition: 'all 0.3s ease',
                      textTransform: 'uppercase',
                      letterSpacing: '0.5px'
                    }}
                  >
                    {salesRep.submitting ? 'Sending...' : 'Request a Call'}
                  </button>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </main>

      {/* Floating Price Summary */}
      {currentStep > 0 && currentStep < 7 && (
        <div style={{
          position: 'fixed',
          top: '140px',
          right: '48px',
          background: 'linear-gradient(135deg, rgba(86, 211, 204, 0.15), rgba(125, 232, 224, 0.08))',
          backdropFilter: 'blur(20px)',
          border: '2px solid #56d3cc',
          borderRadius: '12px',
          padding: '20px 28px',
          boxShadow: '0 8px 32px rgba(86, 211, 204, 0.4)',
          zIndex: 50
        }}>
          <div style={{
            fontSize: '11px',
            color: 'rgba(255,255,255,0.7)',
            marginBottom: '6px',
            textTransform: 'uppercase',
            letterSpacing: '0.5px',
            fontWeight: '600'
          }}>
            {config.leaseTerm ? `Monthly (${config.leaseTerm} mo. lease)` : 'Estimated Monthly'}
          </div>
          <div style={{
            fontSize: '32px',
            fontWeight: '900',
            color: '#56d3cc',
            letterSpacing: '-1px'
          }}>
            ${Math.round(calculateMonthlyTotal()).toLocaleString()}/mo
          </div>
          {config.leaseTerm && (
            <div style={{
              fontSize: '12px',
              color: 'rgba(255,255,255,0.6)',
              marginTop: '8px'
            }}>
              ${calculateContractTotal().toLocaleString()} total
            </div>
          )}
        </div>
      )}

      {/* Order confirmation. Rendered at the component root so it overlays whatever step
          is showing, and it does not auto-dismiss — an alert() the customer clicks away
          takes the order id and Salesforce references with it. */}
      {orderConfirmation && (
        <div
          role="dialog"
          aria-modal="true"
          aria-labelledby="order-confirmation-title"
          style={{
            position: 'fixed',
            inset: 0,
            background: 'rgba(0,0,0,0.78)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '24px',
            zIndex: 1100,
            overflowY: 'auto'
          }}
        >
          <div style={{
            background: '#1b1e23',
            border: `1px solid ${orderConfirmation.placed ? 'rgba(86,211,204,0.35)' : 'rgba(255,90,90,0.35)'}`,
            borderRadius: '16px',
            padding: '40px',
            maxWidth: '560px',
            width: '100%',
            boxShadow: '0 32px 80px rgba(0,0,0,0.6)'
          }}>
            {orderConfirmation.placed ? (
              <>
                <div style={{ marginBottom: '20px', color: '#56d3cc' }}>
                  <CheckCircle width={56} height={56} />
                </div>
                <h2 id="order-confirmation-title" style={{
                  margin: '0 0 8px',
                  fontSize: '30px',
                  fontWeight: '900',
                  color: '#fff',
                  letterSpacing: '-0.5px'
                }}>
                  Your order is placed
                </h2>
                <p style={{
                  margin: '0 0 28px',
                  fontSize: '15px',
                  lineHeight: '1.6',
                  color: 'rgba(255,255,255,0.7)'
                }}>
                  It has been filed with our sales team and a quote has been prepared.
                  We'll contact you at <strong style={{ color: '#fff' }}>{orderConfirmation.email}</strong>
                  {' '}to confirm pricing and schedule deployment.
                </p>
              </>
            ) : (
              <>
                <h2 id="order-confirmation-title" style={{
                  margin: '0 0 8px',
                  fontSize: '26px',
                  fontWeight: '900',
                  color: '#ff8a8a'
                }}>
                  We couldn't place your order
                </h2>
                <p style={{
                  margin: '0 0 20px',
                  fontSize: '15px',
                  lineHeight: '1.6',
                  color: 'rgba(255,255,255,0.75)'
                }}>
                  Nothing has been filed, so please try again. If it keeps failing, contact
                  us at <strong style={{ color: '#fff' }}>sales@lvt.com</strong> and quote
                  reference <strong style={{ color: '#fff' }}>{orderConfirmation.orderId}</strong>.
                </p>
                <div style={{
                  fontSize: '13px',
                  lineHeight: '1.5',
                  color: '#ff8a8a',
                  background: 'rgba(255,90,90,0.1)',
                  border: '1px solid rgba(255,90,90,0.28)',
                  borderRadius: '8px',
                  padding: '12px 14px',
                  marginBottom: '24px'
                }}>
                  {orderConfirmation.hermes.message}
                </div>
              </>
            )}

            <div style={{
              borderTop: '1px solid rgba(255,255,255,0.1)',
              paddingTop: '20px',
              fontSize: '14px',
              lineHeight: '2',
              color: 'rgba(255,255,255,0.8)'
            }}>
              <Row label="Order reference" value={orderConfirmation.orderId} />
              <Row
                label="Units"
                value={`${orderConfirmation.units} ${orderConfirmation.units === 1 ? 'unit' : 'units'}`}
              />
              {orderConfirmation.termMonths && (
                <Row label="Lease term" value={`${orderConfirmation.termMonths} months`} />
              )}
              <Row
                label="Estimated monthly"
                value={`$${orderConfirmation.monthly.toLocaleString()}`}
              />
              {orderConfirmation.placed
                && orderConfirmation.hermes.summary
                && orderConfirmation.hermes.summary.quote_name && (
                <Row label="Quote" value={orderConfirmation.hermes.summary.quote_name} />
              )}
            </div>

            {orderConfirmation.placed && (
              <p style={{
                margin: '20px 0 0',
                fontSize: '12px',
                lineHeight: '1.5',
                color: 'rgba(255,255,255,0.5)'
              }}>
                Figures shown are a non-binding estimate. Your formal quote is priced from
                the current LVT price book and may differ. Shipping and set-up fees are not
                included above and will be applied to your final quote.
              </p>
            )}

            {/* Surfaced but not treated as a failure: the order is filed either way, and
                this is an internal integration detail rather than the customer's problem. */}
            {orderConfirmation.placed && !orderConfirmation.webhookSubmitted && (
              <p style={{
                margin: '12px 0 0',
                fontSize: '12px',
                color: '#e0b341'
              }}>
                Note: a secondary notification could not be delivered. Your order is filed
                and no action is needed.
              </p>
            )}

            <button
              onClick={() => setOrderConfirmation(null)}
              style={{
                width: '100%',
                marginTop: '28px',
                padding: '16px',
                background: orderConfirmation.placed ? '#56d3cc' : 'transparent',
                color: orderConfirmation.placed ? '#1b1e23' : 'rgba(255,255,255,0.85)',
                border: orderConfirmation.placed ? 'none' : '1px solid rgba(255,255,255,0.25)',
                borderRadius: '10px',
                fontSize: '15px',
                fontWeight: '800',
                cursor: 'pointer',
                textTransform: 'uppercase',
                letterSpacing: '0.5px'
              }}
            >
              {orderConfirmation.placed ? 'Done' : 'Close and try again'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// One label/value line in the confirmation summary.
const Row = ({ label, value }) => (
  <div style={{ display: 'flex', justifyContent: 'space-between', gap: '16px' }}>
    <span style={{ color: 'rgba(255,255,255,0.55)' }}>{label}</span>
    <span style={{ fontWeight: '700', color: '#fff', textAlign: 'right' }}>{value}</span>
  </div>
);

    ReactDOM.createRoot(document.getElementById('root')).render(<LVTConfigurator />);
  </script>
</body>
</html>
