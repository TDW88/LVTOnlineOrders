<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;
    
    // Icon components (inline replacements for lucide-react)
    const CheckCircle = (props) => (

    const Eye = (props) => (

    const ScanLine = (props) => (

        <path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4"/><path d="m16 8-4-4"/><path d="M12 16a4 4 0 0 0 4-4"/><path d="M20 12a8 8 0 0 1-8 8"/>
      </svg>
    );

    const Headset = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={props.width || 24} height={props.height || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={props.style}>
        <path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M3 14a2 2 0 0 1 2-2h1v6H5a2 2 0 0 1-2-2Z"/><path d="M21 14a2 2 0 0 0-2-2h-1v6h1a2 2 0 0 0 2-2Z"/><path d="M18 18v1a3 3 0 0 1-3 3h-3"/>
      </svg>
    );

const WEBHOOK_URL = 'https://webhooks.workato.com/webhooks/rest/6a7e39d0-1da9-4e30-8ab7-b7c732cbcb0f/order';

const UNIT_TYPES = [
  {
    id: 'mobile',
    name: 'Mobile Security Unit',
    pluralName: 'Mobile Security Units',
    baseMonthly: 1600,
    image: 'https://cdn.prod.website-files.com/674d649ddd92d4cd09236107/68c180ba911caf0351e75fde_81d8df77eec8c23c496c2124ef88fd43_liveunit2%201%402x.avif',
    imageAlt: 'LVT Mobile Security Unit with solar panel and camera mast',
    description: "LVT's mobile units are a versatile, rapidly deployable solution to a wide range of security needs. Each self-contained unit includes solar panels, cellular connectivity, powerful lighting, a loud speaker, and a configurable selection of high-end cameras.",
    needs: [
      'Extremely rapid deployment',
      'On- or off-grid connectivity',
      'Adjustable, mobile coverage',
      'Automatic detection and deterrence'
    ],
    generatorEligible: true
  },
  {
    id: 'wall',
    name: 'Wall Mount Unit',
    pluralName: 'Wall Mount Units',
    baseMonthly: 1500,
    image: 'https://cdn.prod.website-files.com/674d649ddd92d4cd09236107/6838e36d3efe8b49f00fbc74_Wall-Mount.avif',
    imageAlt: 'LVT Wall Mount security unit',
    description: 'Wall mount units deliver fixed-position surveillance with a compact footprint, ideal for permanent coverage of entryways, loading zones, and building perimeters.',
    needs: [
      'Permanent coverage for fixed locations',
      'Compact installation footprint',
      'Consistent power availability',
      'Full-time deterrence at entry points'
    ],
    generatorEligible: false
  },
  {
    id: 'guardgate',
    name: 'Guardgate',
    pluralName: 'Guardgates',
    baseMonthly: 2000,
    image: 'images/GuardGate-down.png',
    imageAlt: 'LVT Guardgate trailer-mounted access control unit with solar panels and barrier arm',
    description: 'Guardgate combines access control with surveillance at the point of entry, pairing a barrier arm with a solar-powered camera mast to manage and record every vehicle entering or leaving your site.',
    needs: [
      'Controlled vehicle access at entry points',
      'Record every entry and exit',
      'Rapid deployment without fixed infrastructure',
      'Deterrence at the gate line'
    ],
    generatorEligible: true
  }
];

function LVTConfigurator() {
  const [currentStep, setCurrentStep] = useState(0);
  const [isSubmitting, setIsSubmitting] = useState(false);
  // "Talk to a sales rep" helper form — shown on every step, separate from the order
  const [salesRep, setSalesRep] = useState({
    open: false,
    name: '',
    email: '',
    phone: '',
    question: '',
    submitting: false,
    submitted: false
  });
  const [config, setConfig] = useState({
    locations: [
      {
        id: 1,
        zipCode: '',
        units: [
          { id: 1, unitType: 'mobile', needsGenerator: false, quantity: 1 }
        ]
      }
    ],
    ndaaCompliant: false,
    nightVision: false,
    lpr: false,
    satCom: false,
    generatorBypass: false, // customer accepts downtime unless externally powered
    softwarePackages: [],
    leaseTerm: null, // in months: 12, 24, 36
    contactInfo: {
      email: '',
      phone: '',
      companyName: '',
      fullName: '',
      billingAddress: {
        street: '',
        city: '',
        state: '',
        zip: ''
      },
      shippingAddresses: [],
      onsiteContact: {
        sameAsPrimary: false, // starts unchecked — the user opts in when it is the same person
        name: '',
        phone: ''
      }
    },
    siteConfig: {
      placementMapName: '',
      placementMapLater: false, // "Placement map will be determined later"
      gpsCoordinates: [], // one { lat, long } per unit, index-aligned with gpsUnitList
      ars: {
        enabled: null, // null | 'yes' | 'no'
        tier: null,    // 'standard' | 'expanded' | 'custom'
        customDetail: '', // required when tier is 'custom'
        contacts: [
          { name: '', email: '', phone: '' },
          { name: '', email: '', phone: '' }
        ]
      },
      securitySchedule: {
        weekdayArm: '',
        weekdayDisarm: '',
        weekendArm: '',
        weekendDisarm: ''
      },
      deterrence: {
        strobes: 'off', // 'off' | 'night' | '24-7'
        floodlight: false,
        audio: false
      },
      areasOfConcern: ''
    }
  });

  const getUnitType = (unitTypeId) => UNIT_TYPES.find(type => type.id === unitTypeId) || UNIT_TYPES[0];
  
  // Generator cost (monthly)
  const GENERATOR_MONTHLY = 1000;
  
  // Hardware options pricing (monthly)
  const NDAA_MONTHLY = 125;
  const NIGHT_VISION_MONTHLY = 175;
  const LPR_MONTHLY = 500;
  const SATCOM_MONTHLY = 500;

  // Alert Response Services (ARS) tiers — priced monthly, per unit.
  // 'custom' covers legacy arrangements and is quoted by a rep rather than priced here.
  const ARS_TIERS = [
    { value: 'standard', label: 'Standard', coverage: '12 hours of coverage', monthly: 300 },
    { value: 'expanded', label: 'Expanded', coverage: '24 hours of coverage', monthly: 500 },
    { value: 'custom', label: 'Custom', coverage: 'Legacy or tailored coverage', monthly: null }
  ];
  const getArsTier = (value) => ARS_TIERS.find(tier => tier.value === value) || null;
  
  // Software packages (monthly)
  const softwarePackages = [
    {
      id: 'detect-deter',
      name: 'Intelligent Deterrence',
      monthlyPrice: 500,
      description: 'AI-powered intrusion detection with automated deterrence (strobes, spotlights, audio warnings)',
      features: ['Real-time threat detection', 'Automated audio warnings', 'Strobe & spotlight activation', 'Custom alert rules']
    },
    {
      id: 'alert-management',
      name: 'Intelligent Investigations',
      monthlyPrice: 500,
      description: 'Advanced alert routing and response workflow management',
      features: ['Multi-channel alerts (SMS, email, push)', 'Alert escalation workflows', 'Response tracking', 'Integration with security teams']
    },
    {
      id: 'enterprise',
      name: 'Intelligent Safety',
      monthlyPrice: 500,
      description: 'SafeNow integration site-wide, the ability to arm and disarm the unit from an approved mobile device',
      features: ['Centralized dashboard', 'Multi-site management', 'Advanced analytics & reporting', 'Custom user permissions', 'API access']
    }
  ];

  // Lease term options
  const leaseTerms = [
    { months: 12, label: '12 Months', discount: 0 },
    { months: 24, label: '24 Months', discount: 0.05 }, // 5% discount
    { months: 36, label: '36 Months', discount: 0.10 }  // 10% discount
  ];

  const steps = ['Location', 'Hardware', 'Software', 'Lease Term', 'Contact Info', 'Configuration', 'Review'];

  const totalUnits = config.locations.reduce((sum, location) => {
    const locationTotal = location.units.reduce((unitSum, unit) => unitSum + (unit.quantity || 0), 0);
    return sum + locationTotal;
  }, 0);

  // One GPS entry per physical unit selected in Step 1 (expanded by quantity)
  const gpsUnitList = config.locations.flatMap(location =>
    location.units.flatMap(unit =>
      Array.from({ length: unit.quantity || 0 }, () => ({
        typeName: getUnitType(unit.unitType).name,
        zip: location.zipCode
      }))
    )
  );

  const uniqueLocationZips = [
    ...new Set(config.locations.map(location => location.zipCode).filter(zip => zip.length === 5))
  ];

  const unitsByZip = config.locations.reduce((acc, location) => {
    if (location.zipCode.length === 5) {
      const locationTotal = location.units.reduce((sum, unit) => sum + (unit.quantity || 0), 0);
      acc[location.zipCode] = (acc[location.zipCode] || 0) + locationTotal;
    }
    return acc;
  }, {});

  useEffect(() => {
    setConfig(prev => {
      const existing = prev.contactInfo.shippingAddresses || [];
      const nextShippingAddresses = uniqueLocationZips.map(zip => {
        const match = existing.find(address => address.zipCode === zip);
        if (match) {
          return { ...match, zipCode: zip };
        }
        return {
          zipCode: zip,
          street: '',
          city: '',
          state: '',
          zip: '',
          sameAsBilling: false
        };
      });

      const hasChanges = nextShippingAddresses.length !== existing.length
        || nextShippingAddresses.some((address, idx) => address.zipCode !== existing[idx]?.zipCode);

      if (!hasChanges) {
        return prev;
      }

      return {
        ...prev,
        contactInfo: {
          ...prev.contactInfo,
          shippingAddresses: nextShippingAddresses
        }
      };
    });
  }, [uniqueLocationZips.join('|')]);

  useEffect(() => {
    setConfig(prev => {
      const nextLocations = prev.locations.map(location => ({
        ...location,
        units: location.units.map(unit => {
          const unitType = getUnitType(unit.unitType);
          if (unitType.generatorEligible) {
            return unit;
          }
          return { ...unit, needsGenerator: false };
        })
      }));
      const hasChanges = nextLocations.some((location, idx) =>
        location.units.some((unit, unitIdx) => unit.needsGenerator !== prev.locations[idx].units[unitIdx].needsGenerator)
      );
      if (!hasChanges) {
        return prev;
      }
      return { ...prev, locations: nextLocations };
    });
  }, [config.locations]);

  // Simulate zip code lookup for generator requirements
  // In production, this would call an API
  const checkGeneratorRequirement = (zip) => {
    // Simplified logic: certain regions need generators
    // This would be replaced with actual API call to lookup table
    const firstDigit = parseInt(zip.charAt(0));
    // Simulate northern/colder states needing generators more often
    // 0-2 = Northeast, 3-5 = Southeast/Central, 6-9 = West
    if (firstDigit >= 0 && firstDigit <= 2) {
      return Math.random() > 0.3; // 70% need generator in cold climates
    } else if (firstDigit >= 3 && firstDigit <= 5) {
      return Math.random() > 0.6; // 40% need generator in moderate climates
    } else {
      return Math.random() > 0.7; // 30% need generator in warm climates
    }
  };



  const addLocation = () => {
    const newId = Math.max(...config.locations.map(location => location.id)) + 1;
    setConfig(prev => ({
      ...prev,
      locations: [
        ...prev.locations,
        {
          id: newId,
          zipCode: '',
          units: [{ id: 1, unitType: 'mobile', needsGenerator: false, quantity: 1 }]
        }
      ]
    }));
  };

  const removeLocation = (locationId) => {
    if (config.locations.length > 1) {
      setConfig(prev => ({
        ...prev,
        locations: prev.locations.filter(location => location.id !== locationId)
      }));
    }
  };

  const updateLocationZipCode = (locationId, zipCode) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location =>
        location.id === locationId ? { ...location, zipCode } : location
      )
    }));
  };

  const addUnitToLocation = (locationId) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        const nextId = Math.max(...location.units.map(unit => unit.id)) + 1;
        return {
          ...location,
          units: [...location.units, { id: nextId, unitType: 'mobile', needsGenerator: false, quantity: 1 }]
        };
      })
    }));
  };

  const removeUnitFromLocation = (locationId, unitId) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        if (location.units.length === 1) {
          return location;
        }
        return {
          ...location,
          units: location.units.filter(unit => unit.id !== unitId)
        };
      })
    }));
  };

  const updateUnitQuantity = (locationId, unitId, quantity) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        return {
          ...location,
          units: location.units.map(unit =>
            unit.id === unitId ? { ...unit, quantity } : unit
          )
        };
      })
    }));
  };

  const updateUnitType = (locationId, unitId, unitTypeId) => {
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(location => {
        if (location.id !== locationId) {
          return location;
        }
        return {
          ...location,
          units: location.units.map(unit => {
            if (unit.id !== unitId) {
              return unit;
            }
            const unitType = getUnitType(unitTypeId);
            if (!unitType.generatorEligible) {
              return { ...unit, unitType: unitTypeId, needsGenerator: false };
            }
            const needsGenerator = location.zipCode.length === 5
              ? checkGeneratorRequirement(location.zipCode)
              : unit.needsGenerator;
            return { ...unit, unitType: unitTypeId, needsGenerator };
          })
        };
      })
    }));
  };

  const checkGeneratorForUnit = (locationId, unitId, zip) => {
    const location = config.locations.find(entry => entry.id === locationId);
    if (!location) {
      return;
    }
    const unit = location.units.find(entry => entry.id === unitId);
    if (!unit) {
      return;
    }
    const unitType = getUnitType(unit.unitType);
    if (!unitType.generatorEligible) {
      setConfig(prev => ({
        ...prev,
        locations: prev.locations.map(loc => {
          if (loc.id !== locationId) {
            return loc;
          }
          return {
            ...loc,
            units: loc.units.map(line =>
              line.id === unitId ? { ...line, needsGenerator: false } : line
            )
          };
        })
      }));
      return;
    }
    const needsGen = checkGeneratorRequirement(zip);
    setConfig(prev => ({
      ...prev,
      locations: prev.locations.map(loc => {
        if (loc.id !== locationId) {
          return loc;
        }
        return {
          ...loc,
          units: loc.units.map(line =>
            line.id === unitId ? { ...line, needsGenerator: needsGen } : line
          )
        };
      })
    }));
  };

  const handleZipCodeSubmit = () => {
    const allZipsValid = config.locations.every(location =>
      location.zipCode.length === 5 && location.units.every(unit => unit.quantity > 0)
    );
    if (allZipsValid) {
      // Check generator requirements for generator-eligible unit types
      config.locations.forEach(location => {
        location.units.forEach(unit => {
          checkGeneratorForUnit(location.id, unit.id, location.zipCode);
        });
      });
      setCurrentStep(1);
    }
  };

  const calculateMonthlyTotal = () => {
    const unitCount = totalUnits;
    
    const baseMonthlyTotal = config.locations.reduce((sum, location) => {
      const locationTotal = location.units.reduce((unitSum, unit) => {
        const unitType = getUnitType(unit.unitType);
        return unitSum + (unitType.baseMonthly * (unit.quantity || 0));
      }, 0);
      return sum + locationTotal;
    }, 0);
    let perUnitMonthly = 0;
    
    // Add hardware options (applied to all units)
    if (config.ndaaCompliant) {
      perUnitMonthly += NDAA_MONTHLY;
    }
    if (config.nightVision) {
      perUnitMonthly += NIGHT_VISION_MONTHLY;
    }
    if (config.lpr) {
      perUnitMonthly += LPR_MONTHLY;
    }
    if (config.satCom) {
      perUnitMonthly += SATCOM_MONTHLY;
    }
    
    // Calculate base cost for all units
    let monthlyTotal = baseMonthlyTotal + (perUnitMonthly * unitCount);
    
    // Add generators (varies by unit location)
    const generatorCount = config.locations.reduce((sum, location) => {
      const locationGenerators = location.units
        .filter(unit => getUnitType(unit.unitType).generatorEligible && unit.needsGenerator)
        .reduce((unitSum, unit) => unitSum + (unit.quantity || 0), 0);
      return sum + locationGenerators;
    }, 0);
    // Skipped when the customer opts to accept downtime instead of a generator
    if (!config.generatorBypass) {
      monthlyTotal += generatorCount * GENERATOR_MONTHLY;
    }
    
    // Add software packages (per unit)
    config.softwarePackages.forEach(id => {
      const pkg = softwarePackages.find(p => p.id === id);
      if (pkg) monthlyTotal += pkg.monthlyPrice * unitCount;
    });

    // Add Alert Response Services (per unit; 'custom' is quoted separately)
    if (config.siteConfig.ars.enabled === 'yes' && config.siteConfig.ars.tier) {
      const arsTier = getArsTier(config.siteConfig.ars.tier);
      if (arsTier && arsTier.monthly) {
        monthlyTotal += arsTier.monthly * unitCount;
      }
    }
    
    // Apply lease term discount if selected
    if (config.leaseTerm) {
      const term = leaseTerms.find(t => t.months === config.leaseTerm);
      if (term && term.discount > 0) {
        monthlyTotal = monthlyTotal * (1 - term.discount);
      }
    }
    
    return monthlyTotal;
  };

  // Helper to calculate monthly total for a specific term (for lease term cards)
  const calculateMonthlyForTerm = (termMonths) => {
    const unitCount = totalUnits;
    
    const baseMonthlyTotal = config.locations.reduce((sum, location) => {
      const locationTotal = location.units.reduce((unitSum, unit) => {
        const unitType = getUnitType(unit.unitType);
        return unitSum + (unitType.baseMonthly * (unit.quantity || 0));
      }, 0);
      return sum + locationTotal;
    }, 0);
    let perUnitMonthly = 0;
    
    // Add hardware options (applied to all units)
    if (config.ndaaCompliant) {
      perUnitMonthly += NDAA_MONTHLY;
    }
    if (config.nightVision) {
      perUnitMonthly += NIGHT_VISION_MONTHLY;
    }
    if (config.lpr) {
      perUnitMonthly += LPR_MONTHLY;
    }
    if (config.satCom) {
      perUnitMonthly += SATCOM_MONTHLY;
    }
    
    // Calculate base cost for all units
    let monthlyTotal = baseMonthlyTotal + (perUnitMonthly * unitCount);
    
    // Add generators (varies by unit location)
    const generatorCount = config.locations.reduce((sum, location) => {
      const locationGenerators = location.units
        .filter(unit => getUnitType(unit.unitType).generatorEligible && unit.needsGenerator)
        .reduce((unitSum, unit) => unitSum + (unit.quantity || 0), 0);
      return sum + locationGenerators;
    }, 0);
    // Skipped when the customer opts to accept downtime instead of a generator
    if (!config.generatorBypass) {
      monthlyTotal += generatorCount * GENERATOR_MONTHLY;
    }
    
    // Add software packages (per unit)
    config.softwarePackages.forEach(id => {
      const pkg = softwarePackages.find(p => p.id === id);
      if (pkg) monthlyTotal += pkg.monthlyPrice * unitCount;
    });

    // Add Alert Response Services (per unit; 'custom' is quoted separately)
    if (config.siteConfig.ars.enabled === 'yes' && config.siteConfig.ars.tier) {
      const arsTier = getArsTier(config.siteConfig.ars.tier);
      if (arsTier && arsTier.monthly) {
        monthlyTotal += arsTier.monthly * unitCount;
      }
    }
    
    // Apply discount for this specific term
    const term = leaseTerms.find(t => t.months === termMonths);
    if (term && term.discount > 0) {
      monthlyTotal = monthlyTotal * (1 - term.discount);
    }
    
    return monthlyTotal;
  };

  const calculateContractTotal = () => {
    if (!config.leaseTerm) return 0;
    return calculateMonthlyTotal() * config.leaseTerm;
  };

  const toggleHardwareOption = (option) => {
    setConfig(prev => ({ ...prev, [option]: !prev[option] }));
  };

  const toggleSoftwarePackage = (id) => {
    setConfig(prev => {
      const packages = prev.softwarePackages.includes(id)
        ? prev.softwarePackages.filter(p => p !== id)
        : [...prev.softwarePackages, id];
      return { ...prev, softwarePackages: packages };
    });
  };

  const updateContactInfo = (field, value) => {
    setConfig(prev => ({
      ...prev,
      contactInfo: {
        ...prev.contactInfo,
        [field]: value
      }
    }));
  };

  const updateAddress = (type, field, value) => {
    setConfig(prev => ({
      ...prev,
      contactInfo: {
        ...prev.contactInfo,
        [type]: {
          ...prev.contactInfo[type],
          [field]: value
        }
      }
    }));
  };

  const updateShippingAddress = (zipCode, field, value) => {
    setConfig(prev => ({
      ...prev,
      contactInfo: {
        ...prev.contactInfo,
        shippingAddresses: prev.contactInfo.shippingAddresses.map(address =>
          address.zipCode === zipCode ? { ...address, [field]: value } : address
        )
      }
    }));
  };

  const updateSiteConfig = (field, value) => {
    setConfig(prev => ({
      ...prev,
      siteConfig: { ...prev.siteConfig, [field]: value }
    }));
  };

  const updateSecuritySchedule = (field, value) => {
    setConfig(prev => ({
      ...prev,

      }
    }));

  const updateSalesRep = (field, value) => {
    setSalesRep(prev => ({ ...prev, [field]: value }));

  const submitSalesRepRequest = async () => {
    if (!salesRepValid || salesRep.submitting) return;
    setSalesRep(prev => ({ ...prev, submitting: true }));

    const payload = JSON.stringify({
      formType: 'sales_rep_inquiry',
      timestamp: new Date().toISOString(),
      name: salesRep.name,
      email: salesRep.email,
      phone: salesRep.phone,
      question: salesRep.question,
      // Where in the flow they asked for help
      stepNumber: currentStep + 1,
      stepName: steps[currentStep]
    });

    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        credentials: 'omit'
      });
    } catch (error) {
      // Cross-origin fallback — the request still reaches the endpoint
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: payload
        });
      } catch (fallbackError) {
        console.error('Sales rep request error:', fallbackError);
      }
    } finally {
      setSalesRep(prev => ({ ...prev, submitting: false, submitted: true }));
    }
  };

    setConfig(prev => ({

      siteConfig: {

        ars: { ...prev.siteConfig.ars, [field]: value }

    }));

          contacts: prev.siteConfig.ars.contacts.map((contact, i) =>

        }
      }
    }));
  };

  const updateGpsCoordinate = (index, field, value) => {
    setConfig(prev => {
      const list = [...prev.siteConfig.gpsCoordinates];
      while (list.length <= index) list.push({ lat: '', long: '' });
      list[index] = { ...list[index], [field]: value };
      return { ...prev, siteConfig: { ...prev.siteConfig, gpsCoordinates: list } };

    if (currentStep === 1) return true; // Hardware options are optional
    if (currentStep === 2) return true; // Software packages are optional
    if (currentStep === 3) return config.leaseTerm !== null; // Lease term required
    if (currentStep === 4) {

      const billingValid = billingAddress.street && billingAddress.city &&

      const shippingValid = uniqueLocationZips.length > 0
        ? uniqueLocationZips.every(zip => {
          const address = shippingAddresses.find(entry => entry.zipCode === zip);
          if (!address) return false;
          if (address.sameAsBilling) return true;
          return address.street && address.city && address.state && address.zip;

      // Onsite contact: only required when it is a different person
      const { onsiteContact } = config.contactInfo;
      const onsiteValid = onsiteContact.sameAsPrimary

              style={{
                padding: '14px 40px',
                background: !canProceed() 
                  ? 'rgba(86, 211, 204, 0.2)' 
                  : '#56d3cc',
                color: !canProceed() ? 'rgba(255,255,255,0.4)' : '#fff',
                border: 'none',
                borderRadius: '10px',
                fontSize: '14px',
                fontWeight: '800',
                cursor: !canProceed() ? 'not-allowed' : 'pointer',
                transition: 'all 0.3s ease',
                textTransform: 'uppercase',
                letterSpacing: '0.5px'
              }}
              onMouseOver={(e) => {
                if (canProceed()) {
                  e.target.style.background = '#00a19a';
                  e.target.style.transform = 'scale(1.02)';
                }
              }}
              onMouseOut={(e) => {
                if (canProceed()) {
                  e.target.style.background = '#56d3cc';
                  e.target.style.transform = 'scale(1)';
                }
              }}
            >
              Continue →
            </button>
          ) : (
            <button
              onClick={() => setCurrentStep(0)}
              style={{
                padding: '14px 40px',
                background: 'rgba(255,255,255,0.08)',
                color: '#fff',
                border: '2px solid rgba(255,255,255,0.15)',
                borderRadius: '10px',
                fontSize: '14px',
                fontWeight: '700',
                cursor: 'pointer',
                transition: 'all 0.3s ease',
                textTransform: 'uppercase',
                letterSpacing: '0.5px'
              }}
              onMouseOver={(e) => {
                e.target.style.background = 'rgba(255,255,255,0.12)';
              }}
              onMouseOut={(e) => {
                e.target.style.background = 'rgba(255,255,255,0.08)';
              }}
            >
              Start Over
            </button>
          )}
        </div>

        {/* Talk to a Sales Rep — available on every step */}
        <div style={{
          marginTop: '56px',
          maxWidth: '800px',
          marginLeft: 'auto',
          marginRight: 'auto',
          background: 'rgba(255,255,255,0.03)',
          border: '1px solid rgba(255,255,255,0.12)',
          borderRadius: '16px',
          padding: '28px 32px'
        }}>
          {salesRep.submitted ? (
            <div style={{ textAlign: 'center' }}>
              <CheckCircle style={{ color: '#56d3cc', width: '32px', height: '32px' }} />
              <div style={{
                fontSize: '18px',
                fontWeight: '800',
                marginTop: '12px',
                marginBottom: '6px'
              }}>
                Thanks — we'll be in touch shortly.
              </div>
              <div style={{ fontSize: '14px', color: 'rgba(255,255,255,0.6)' }}>
                An LVT sales rep will reach out to {salesRep.email}. Your configuration has been saved, so you can keep going where you left off.
              </div>
            </div>
          ) : (
            <React.Fragment>
              <div
                onClick={() => updateSalesRep('open', !salesRep.open)}
                style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  gap: '16px',
                  cursor: 'pointer'
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                  <Headset width={24} height={24} style={{ color: '#56d3cc' }} />
                  <div style={{
                    fontSize: '17px',
                    fontWeight: '800',
                    letterSpacing: '-0.2px'
                  }}>
                    Have Questions? Talk to an LVT Sales Rep Directly!
                  </div>
                </div>
                <div style={{
                  fontSize: '13px',
                  fontWeight: '700',
                  color: '#56d3cc',
                  textTransform: 'uppercase',
                  letterSpacing: '0.5px',
                  whiteSpace: 'nowrap'
                }}>
                  {salesRep.open ? 'Close' : 'Contact Us'}
                </div>
              </div>

              {salesRep.open && (
                <div style={{
                  marginTop: '24px',
                  paddingTop: '24px',
                  borderTop: '1px solid rgba(255,255,255,0.1)'
                }}>
                  <p style={{
                    fontSize: '14px',
                    color: 'rgba(255,255,255,0.6)',
                    marginBottom: '20px',
                    lineHeight: '1.6'
                  }}>
                    Leave your details and a rep will get back to you. You won't lose your progress.
                  </p>
                  <div
                    className="contact-grid"
                    style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', marginBottom: '16px' }}
                  >
                    {[
                      { label: 'Name *', field: 'name', type: 'text', placeholder: 'Full Name' },
                      { label: 'Email Address *', field: 'email', type: 'email', placeholder: 'your.email@company.com' },
                      { label: 'Phone Number', field: 'phone', type: 'tel', placeholder: '(555) 555-5555' }
                    ].map(cell => (
                      <div key={cell.field}>
                        <label style={{
                          display: 'block',
                          fontSize: '12px',
                          fontWeight: '700',
                          textTransform: 'uppercase',
                          letterSpacing: '0.5px',
                          marginBottom: '8px',
                          color: 'rgba(255,255,255,0.7)'
                        }}>
                          {cell.label}
                        </label>
                        <input
                          type={cell.type}
                          value={salesRep[cell.field]}
                          onChange={(e) => updateSalesRep(cell.field, e.target.value)}
                          placeholder={cell.placeholder}
                          style={{
                            width: '100%',
                            padding: '12px 16px',
                            background: 'rgba(39, 42, 47, 0.6)',
                            border: '2px solid rgba(255,255,255,0.15)',
                            borderRadius: '8px',
                            color: '#fff',
                            fontSize: '16px',
                            fontWeight: '500',
                            outline: 'none',
                            transition: 'all 0.3s ease'
                          }}
                          onFocus={(e) => {
                            e.target.style.border = '2px solid #56d3cc';
                            e.target.style.background = 'rgba(86, 211, 204, 0.08)';
                          }}
                          onBlur={(e) => {
                            e.target.style.border = '2px solid rgba(255,255,255,0.15)';
                            e.target.style.background = 'rgba(39, 42, 47, 0.6)';
                          }}
                        />
                      </div>
                    ))}
                  </div>

                  <label style={{
                    display: 'block',
                    fontSize: '12px',
                    fontWeight: '700',
                    textTransform: 'uppercase',
                    letterSpacing: '0.5px',
                    marginBottom: '8px',
                    color: 'rgba(255,255,255,0.7)'
                  }}>
                    What can we help with?
                  </label>
                  <textarea
                    value={salesRep.question}
                    onChange={(e) => updateSalesRep('question', e.target.value)}
                    placeholder="Ask us anything about pricing, hardware, or deployment..."
                    rows={3}
                    style={{
                      width: '100%',
                      padding: '14px 16px',
                      background: 'rgba(39, 42, 47, 0.6)',
                      border: '2px solid rgba(255,255,255,0.15)',
                      borderRadius: '8px',
                      color: '#fff',
                      fontSize: '16px',
                      fontWeight: '500',
                      fontFamily: 'inherit',
                      lineHeight: '1.6',
                      outline: 'none',
                      resize: 'vertical',
                      marginBottom: '20px',
                      transition: 'all 0.3s ease'
                    }}
                    onFocus={(e) => {
                      e.target.style.border = '2px solid #56d3cc';
                      e.target.style.background = 'rgba(86, 211, 204, 0.08)';
                    }}
                    onBlur={(e) => {
                      e.target.style.border = '2px solid rgba(255,255,255,0.15)';
                      e.target.style.background = 'rgba(39, 42, 47, 0.6)';
                    }}
                  />

                  <button
                    onClick={submitSalesRepRequest}
                    disabled={!salesRepValid || salesRep.submitting}
                    style={{
                      padding: '14px 32px',
                      background: (!salesRepValid || salesRep.submitting) ? 'rgba(86, 211, 204, 0.2)' : '#56d3cc',
                      color: (!salesRepValid || salesRep.submitting) ? 'rgba(255,255,255,0.4)' : '#1b1e23',
                      border: 'none',
                      borderRadius: '10px',
                      fontSize: '14px',
                      fontWeight: '800',
                      cursor: (!salesRepValid || salesRep.submitting) ? 'not-allowed' : 'pointer',
                      transition: 'all 0.3s ease',
                      textTransform: 'uppercase',
                      letterSpacing: '0.5px'
                    }}
                  >
                    {salesRep.submitting ? 'Sending...' : 'Request a Call'}
                  </button>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </main>

      {/* Floating Price Summary */}
      {currentStep > 0 && currentStep < 6 && (
        <div style={{
          position: 'fixed',
          top: '140px',
          right: '48px',
          background: 'linear-gradient(135deg, rgba(86, 211, 204, 0.15), rgba(125, 232, 224, 0.08))',
          backdropFilter: 'blur(20px)',
          border: '2px solid #56d3cc',
          borderRadius: '12px',
          padding: '20px 28px',
          boxShadow: '0 8px 32px rgba(86, 211, 204, 0.4)',
          zIndex: 50
        }}>
          <div style={{
            fontSize: '11px',
            color: 'rgba(255,255,255,0.7)',
            marginBottom: '6px',
            textTransform: 'uppercase',
            letterSpacing: '0.5px',
            fontWeight: '600'
          }}>
            {config.leaseTerm ? `Monthly (${config.leaseTerm} mo. lease)` : 'Estimated Monthly'}
          </div>
          <div style={{
            fontSize: '32px',
            fontWeight: '900',
            color: '#56d3cc',
            letterSpacing: '-1px'
          }}>
            ${Math.round(calculateMonthlyTotal()).toLocaleString()}/mo
          </div>
          {config.leaseTerm && (
            <div style={{
              fontSize: '12px',
              color: 'rgba(255,255,255,0.6)',
              marginTop: '8px'
            }}>
              ${calculateContractTotal().toLocaleString()} total
            </div>
          )}
        </div>
      )}
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<LVTConfigurator />);
  </script>
</body>
</html>
